name: Unprivileged Cluster Validation

# Runs SREGym's problem lifecycle validator (deploy, inject the fault, oracle
# fails, recover, oracle passes) against the prototype in docker/userns-k3s:
# a four-node k3s cluster inside one container started WITHOUT --privileged,
# added capabilities or devices. Validates that the prototype can host SREGym.

on:
  workflow_dispatch:
    inputs:
      problems:
        description: Problem IDs separated by spaces, or a suite name such as sregym-lite
        required: true
        default: sregym-lite
      max_parallel:
        description: Jobs to run at once
        required: true
        default: '6'
  push:  # TEMP: validate from this branch; remove before merge
    branches: [claude/intelligent-ramanujan-eeykkl]
    paths:
      - '.github/workflows/userns-k3s-validation.yml'
      - 'docker/userns-k3s/**'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      problems: ${{ steps.plan.outputs.problems }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Resolve problems
        id: plan
        env:
          PROBLEMS: ${{ inputs.problems || 'network_policy_block' }}
        run: |
          uv run --frozen python - >> "$GITHUB_OUTPUT" <<'EOF'
          import json
          import os

          from sregym.conductor.problem_sets import PROBLEM_SETS

          value = os.environ["PROBLEMS"].strip()
          ids = list(PROBLEM_SETS[value]) if value in PROBLEM_SETS else value.split()
          print("problems=" + json.dumps(ids))
          EOF

  validate:
    needs: plan
    name: validate (${{ matrix.problem }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || '6') }}
      matrix:
        problem: ${{ fromJSON(needs.plan.outputs.problems) }}
    env:
      PROBLEM: ${{ matrix.problem }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Raise inotify limits
        run: sudo sysctl -w fs.inotify.max_user_watches=524288 fs.inotify.max_user_instances=512

      - name: Allow user namespaces for the cluster container
        # Ubuntu 24.04 confines user namespaces created by unconfined processes,
        # and docker-default denies mount. Hosts permit rootless container tools
        # the same way: an AppArmor profile with the userns rule.
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo tee /etc/apparmor.d/sregym-userns > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile sregym-userns flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/sregym-userns

      - name: Start the image-pull proxy
        run: nohup python3 docker/userns-k3s/egress-proxy.py --port 3128 > "$RUNNER_TEMP/egress-proxy.log" 2>&1 &

      - name: Start the unprivileged cluster
        run: |
          docker build -t sregym-userns-k3s docker/userns-k3s
          docker run -d --name k3s \
            --security-opt seccomp="$PWD/docker/userns-k3s/seccomp.json" \
            --security-opt systempaths=unconfined \
            --security-opt apparmor=sregym-userns \
            --cgroupns=private \
            --add-host=host.docker.internal:host-gateway -e EGRESS_PROXY=host.docker.internal:3128 \
            -p 127.0.0.1:6443:6443 -v userns-k3s:/var/lib/rancher/k3s \
            sregym-userns-k3s
          docker inspect k3s --format 'Privileged={{.HostConfig.Privileged}} CapAdd={{.HostConfig.CapAdd}} Devices={{.HostConfig.Devices}} SecurityOpt={{.HostConfig.SecurityOpt}}'
          kubeconfig=/var/lib/rancher/k3s/nodes/kind-control-plane/etc-rancher/k3s/k3s.yaml
          timeout 300 bash -c "until docker exec k3s test -s $kubeconfig; do sleep 3; done"
          mkdir -p ~/.kube
          docker exec k3s cat "$kubeconfig" > ~/.kube/config
          timeout 300 bash -c 'until [ "$(kubectl get nodes --no-headers 2>/dev/null | grep -c " Ready")" -ge 4 ]; do sleep 5; done'
          kubectl get nodes -o wide

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate problem
        run: |
          uv run python tests/integration/validate_problem.py \
            --problem "$PROBLEM" --summary "$GITHUB_WORKSPACE/validation-summary.md"

      - name: Show validation summary
        if: always()
        run: cat validation-summary.md 2>/dev/null || true

      - name: Dump diagnostics
        if: failure()
        run: |
          docker logs k3s 2>&1 | tail -20 || true
          for n in kind-control-plane kind-worker kind-worker2 kind-worker3; do
            echo "=== node $n ==="
            docker exec k3s tail -n 40 /var/log/node-$n.log 2>/dev/null || true
          done
          kubectl get nodes -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get pods -A --no-headers | grep -v -E 'Running|Completed' | awk '{print $1, $2}' |
            while read -r ns pod; do
              echo "--- $ns/$pod ---"
              kubectl describe pod "$pod" -n "$ns" 2>/dev/null | tail -25
            done || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
          tail -n 30 "$RUNNER_TEMP/egress-proxy.log" || true

      - name: Upload validation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: userns-validation-${{ matrix.problem }}
          path: validation-summary.md
          if-no-files-found: ignore
          retention-days: 14
