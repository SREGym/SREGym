name: Harbor Oracle Sweep

# Runs Harbor's oracle agent on generated SREGym tasks, one problem per job, on
# GitHub-hosted runners through Harbor's local Docker environment. Harbor
# accepts an adapter only when the oracle scores 1.0 on every task; this checks
# that without cloud credentials. Each job deploys the problem's application in
# the task's own sidecar and KIND cluster, so it needs unrestricted egress.

on:
  workflow_dispatch:
    inputs:
      problems:
        description: Problem IDs separated by spaces, or a suite name such as sregym-lite
        required: true
        default: sregym-lite
      max_parallel:
        description: Jobs to run at once
        required: true
        default: '6'
      check_nop:
        description: Also require the no-op agent to score 0 (the fault is live)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      problems: ${{ steps.plan.outputs.problems }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Resolve problems
        id: plan
        env:
          PROBLEMS: ${{ inputs.problems }}
        run: |
          uv run --frozen python - >> "$GITHUB_OUTPUT" <<'EOF'
          import json
          import os

          from sregym.conductor.problem_sets import PROBLEM_SETS

          value = os.environ["PROBLEMS"].strip()
          ids = list(PROBLEM_SETS[value]) if value in PROBLEM_SETS else value.split()
          print("problems=" + json.dumps(ids))
          EOF

  oracle:
    needs: plan
    name: oracle (${{ matrix.problem }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        problem: ${{ fromJSON(needs.plan.outputs.problems) }}
    env:
      HARBOR_VERSION: '0.23.0'
      TASKS: ${{ github.workspace }}/harbor-ci/tasks
      JOBS: ${{ github.workspace }}/harbor-ci/jobs
      PROBLEM: ${{ matrix.problem }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Prepare the runner for the task's cluster
        # k3s needs inotify watches. Ubuntu 24.04's AppArmor stops a container
        # without CAP_SYS_ADMIN from creating the user namespace it runs in.
        run: |
          sudo sysctl -w fs.inotify.max_user_watches=524288 fs.inotify.max_user_instances=512
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build the task image
        run: docker build -f docker/harbor/Dockerfile -t sregym-harbor:ci .

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Harbor
        run: uv tool install "harbor==${HARBOR_VERSION}"

      - name: Generate the task
        # Sized for the 4-CPU, 16 GiB runner.
        run: |
          uv run --frozen python -m sregym.harbor.adapter --task-ids "$PROBLEM" --output-dir "$TASKS" \
            --backend-image sregym-harbor:ci --cpus 4 --memory-mb 12288 --storage-mb 40960

      - name: Oracle agent scores 1
        run: |
          # The adapter saved this dataset's oracle secret beside its tasks.
          export SREGYM_ORACLE_SECRET="$(cat "$TASKS/.sregym-oracle-secret")"
          harbor run -y -q -p "$TASKS" -a oracle -e docker --extra-docker-compose "$GITHUB_WORKSPACE/docker/harbor/local-docker.yaml" -o "$JOBS" --job-name oracle
          python3 .github/scripts/harbor_rewards.py "$JOBS/oracle" 1

      - name: No-op agent scores 0
        if: inputs.check_nop
        run: |
          harbor run -y -q -p "$TASKS" -a nop -e docker --extra-docker-compose "$GITHUB_WORKSPACE/docker/harbor/local-docker.yaml" -o "$JOBS" --job-name nop
          python3 .github/scripts/harbor_rewards.py "$JOBS/nop" 0

      - name: Show setup and backend logs
        if: failure()
        run: bash .github/scripts/harbor_diagnostics.sh "$JOBS" --logs

      - name: Upload Harbor jobs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-oracle-${{ matrix.problem }}
          path: harbor-ci/jobs
          if-no-files-found: ignore
          retention-days: 14
