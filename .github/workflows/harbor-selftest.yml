name: Harbor Self-Test

# Runs SREGym's Harbor self-test task through Harbor itself on the runner's
# Docker: the unprivileged task container, its k3s cluster, the filtered API
# proxy, the healthcheck, the unprivileged agent user and shared-mode grading.

on:
  push:
    branches: [main]
    paths:
      - 'sregym/harbor/**'
      - 'sregym/service/k8s_proxy.py'
      - 'docker/harbor/**'
      - 'docker/userns-k3s/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/scripts/harbor_rewards.py'
      - '.github/scripts/harbor_diagnostics.sh'
      - '.github/workflows/harbor-selftest.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'sregym/harbor/**'
      - 'sregym/service/k8s_proxy.py'
      - 'docker/harbor/**'
      - 'docker/userns-k3s/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/scripts/harbor_rewards.py'
      - '.github/scripts/harbor_diagnostics.sh'
      - '.github/workflows/harbor-selftest.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  harbor-selftest:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      HARBOR_VERSION: '0.23.0'
      TASKS: ${{ github.workspace }}/harbor-ci/tasks
      JOBS: ${{ github.workspace }}/harbor-ci/jobs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Prepare the runner for the task's cluster
        # k3s needs inotify watches. Ubuntu 24.04's AppArmor stops a container
        # without CAP_SYS_ADMIN from creating the user namespace it runs in.
        run: |
          sudo sysctl -w fs.inotify.max_user_watches=524288 fs.inotify.max_user_instances=512
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build the task image
        run: docker build -f docker/harbor/Dockerfile -t sregym-harbor:ci .

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Harbor
        run: uv tool install "harbor==${HARBOR_VERSION}"

      - name: Generate the self-test task
        # Sized for the 4-CPU runner; the self-test deploys one nginx pod.
        run: |
          uv run --frozen python -m sregym.harbor.adapter --self-test --output-dir "$TASKS" \
            --backend-image sregym-harbor:ci --cpus 2 --memory-mb 4096 --storage-mb 20480

      - name: Oracle agent scores 1
        run: |
          # The adapter saved this dataset's oracle secret beside its tasks.
          export SREGYM_ORACLE_SECRET="$(cat "$TASKS/.sregym-oracle-secret")"
          harbor run -y -q -p "$TASKS/harbor-selftest" -a oracle -e docker --extra-docker-compose "$GITHUB_WORKSPACE/docker/harbor/local-docker.yaml" -o "$JOBS" --job-name oracle
          python3 .github/scripts/harbor_rewards.py "$JOBS/oracle" 1

      - name: No-op agent scores 0
        run: |
          harbor run -y -q -p "$TASKS/harbor-selftest" -a nop -e docker --extra-docker-compose "$GITHUB_WORKSPACE/docker/harbor/local-docker.yaml" -o "$JOBS" --job-name nop
          python3 .github/scripts/harbor_rewards.py "$JOBS/nop" 0

      - name: Show setup and backend logs
        if: failure()
        run: bash .github/scripts/harbor_diagnostics.sh "$JOBS" --logs

      - name: Upload Harbor jobs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harbor-selftest-jobs
          path: harbor-ci/jobs
          if-no-files-found: ignore
          retention-days: 14
