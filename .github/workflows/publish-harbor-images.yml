name: Publish Harbor Image

# Publishes the image that every generated Harbor task builds on
# (docker/harbor): an unprivileged k3s cluster, the SREGym backend and the
# agent's tools, in one container.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (default is the commit's short SHA)
        required: false
      latest:
        description: Also tag the sidecar image as latest
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REGISTRY: ghcr.io/sregym

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Choose the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "tag=${INPUT_TAG:-$(git rev-parse --short=12 HEAD)}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the task image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          LATEST: ${{ inputs.latest }}
        run: |
          tags=(-t "$REGISTRY/sregym-harbor:$TAG")
          if [[ $LATEST == true ]]; then tags+=(-t "$REGISTRY/sregym-harbor:latest"); fi
          # BuildKit picks up docker/harbor/Dockerfile.dockerignore. The source
          # label links the GHCR package to this repository.
          docker buildx build --push "${tags[@]}" -f docker/harbor/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.description=SREGym Harbor task image: unprivileged k3s cluster, backend and agent tools" .

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "Generate tasks that use this image:"
            echo '```'
            echo "uv run python -m sregym.harbor.adapter --output-dir datasets/sregym \\"
            echo "  --backend-image $REGISTRY/sregym-harbor:$TAG"
            echo '```'
            echo "Cloud providers pull it anonymously: make the GHCR package public once."
          } >> "$GITHUB_STEP_SUMMARY"
