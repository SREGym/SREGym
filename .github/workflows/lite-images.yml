name: Publish multiarch Lite images

on:
  workflow_dispatch:
  push:
    branches: [main, feat/macos-lite-arm64]
    paths:
      - .github/workflows/lite-images.yml
      - docker/lite-images.hcl
      - docker/test_lite_image.sh
      - docker/locust-exporter/**
      - docker/wrk2/**
      - SREGym-applications

permissions:
  contents: read

concurrency:
  group: lite-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/sregym
  IMAGE_TAG: sha-${{ github.sha }}
  REVISION: ${{ github.sha }}

jobs:
  matrix:
    if: github.repository == 'SREGym/SREGym'
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - id: targets
        run: |
          targets=$(docker buildx bake -f docker/lite-images.hcl --print publish | jq -c '.group.publish.targets')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.targets) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, test, and push native image
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="$REGISTRY/$TARGET:$IMAGE_TAG-$ARCH"
          cache="$REGISTRY/$TARGET:buildcache-$ARCH"
          docker buildx bake -f docker/lite-images.hcl "$TARGET" \
            --set "*.platform=linux/$ARCH" \
            --set "$TARGET.tags=$image" \
            --set "$TARGET.cache-from=type=registry,ref=$cache" \
            --set "$TARGET.cache-to=type=registry,ref=$cache,mode=max" \
            --provenance=false --load
          bash docker/test_lite_image.sh "$TARGET" "$image" "$ARCH"
          docker push "$image"

  publish:
    needs: [matrix, build]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.matrix.outputs.targets) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify the multiarch index
        env:
          TARGET: ${{ matrix.target }}
        run: |
          image="$REGISTRY/$TARGET:$IMAGE_TAG"
          docker buildx imagetools create --tag "$image" "$image-amd64" "$image-arm64"
          docker buildx imagetools inspect --raw "$image" | jq -e '
            [.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]'
          echo "Published \`$image\` (linux/amd64, linux/arm64)" >> "$GITHUB_STEP_SUMMARY"
