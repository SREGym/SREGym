name: Integration Smoke Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/workflows/claude.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/workflows/claude.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ── Cluster tooling ───────────────────────────────────────────────
      - name: Install Kind
        run: |
          curl -Lo /tmp/kind https://kind.sigs.k8s.io/dl/v0.28.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Prepare /run/udev for OpenEBS NDM
        run: sudo mkdir -p /run/udev

      # All kind nodes share the runner's inotify limits. The hosted image's
      # defaults run out once four nodes start, and pods that need an inotify
      # instance (kube-proxy, Calico install-cni, promtail) then crash-loop
      # with "too many open files". Values match kind/README.md.
      - name: Raise inotify limits for kind
        run: |
          sysctl fs.inotify.max_user_instances fs.inotify.max_user_watches
          sudo sysctl -w fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=1048576

      - name: Create kind cluster with Calico
        run: bash kind/setup_kind_cluster.sh x86

      # ── Python environment ────────────────────────────────────────────
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      # ── Generate mitigation-only tasklist ─────────────────────────────
      - name: Generate tasklist.yml (mitigation-only)
        run: |
          cat > sregym/conductor/tasklist.yml << 'EOF'
          all:
            problems:
              misconfig_app_hotel_res:
                - mitigation
          EOF

      # ── Run smoke test ────────────────────────────────────────────────
      - name: Run smoke test
        run: uv run pytest tests/integration/smoke_test.py -v -s -m integration --allow-kubernetes

      # ── Diagnostics on failure ────────────────────────────────────────
      - name: Dump cluster diagnostics
        if: failure()
        run: |
          echo "=== Cluster Info ==="
          kubectl cluster-info || true
          echo "=== All Pods (all namespaces) ==="
          kubectl get pods -A -o wide || true
          echo "=== Pod Descriptions (non-Running) ==="
          kubectl get pods -A --no-headers | grep -v Running | awk '{print $1, $2}' | \
            while read ns pod; do
              echo "--- $ns/$pod ---"
              kubectl describe pod "$pod" -n "$ns" 2>/dev/null | tail -30
            done || true
          echo "=== Recent Events ==="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -50 || true

      - name: Export kind logs
        if: failure()
        run: kind export logs /tmp/kind-logs || true

      - name: Upload kind logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kind-logs
          path: /tmp/kind-logs/
          if-no-files-found: ignore
