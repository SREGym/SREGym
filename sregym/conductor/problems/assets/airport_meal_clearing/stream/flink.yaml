apiVersion: v1
kind: ConfigMap
metadata:
  name: __SESSION__-settings
data:
  JOB_MANAGER_RPC_ADDRESS: __SESSION__
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: __SESSION__
    jobmanager.bind-host: 0.0.0.0
    taskmanager.bind-host: 0.0.0.0
    rest.bind-address: 0.0.0.0
    blob.server.port: 6124
    jobmanager.memory.process.size: 400m
    jobmanager.memory.jvm-metaspace.size: 128m
    jobmanager.memory.jvm-overhead.min: 64m
    taskmanager.memory.process.size: 704m
    taskmanager.memory.jvm-metaspace.size: 128m
    taskmanager.memory.jvm-overhead.min: 96m
    taskmanager.memory.managed.fraction: 0.10
    taskmanager.memory.network.min: 32m
    taskmanager.memory.network.max: 64m
    taskmanager.numberOfTaskSlots: 10
    env.java.opts.all: -XX:ActiveProcessorCount=2
    state.checkpoints.dir: file:///stream-state/checkpoints
    state.savepoints.dir: file:///stream-state/savepoints
    state.checkpoints.num-retained: 2
    execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
---
apiVersion: v1
kind: Service
metadata:
  name: __SESSION__
spec:
  selector:
    app: __SESSION__
    component: jobmanager
  ports:
    - name: rest
      port: 8081
    - name: rpc
      port: 6123
    - name: blob
      port: 6124
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __SESSION__-jobmanager
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: __SESSION__
      component: jobmanager
  template:
    metadata:
      labels:
        app: __SESSION__
        component: jobmanager
    spec:
      securityContext:
        fsGroup: 9999
      containers:
        - name: flink
          image: __FLINK_IMAGE__
          imagePullPolicy: IfNotPresent
          args: [jobmanager]
          envFrom:
            - configMapRef:
                name: __SESSION__-settings
          readinessProbe:
            httpGet:
              port: 8081
              path: /overview
            periodSeconds: 2
          resources:
            requests:
              cpu: 150m
              memory: 352Mi
            limits:
              cpu: "2"
              memory: 448Mi
          volumeMounts:
            - name: state
              mountPath: /stream-state
            - name: logging
              mountPath: /opt/flink/conf/log4j-console.properties
              subPath: log4j-console.properties
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: stream-state
        - name: logging
          configMap:
            name: flink-session-logging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __SESSION__-taskmanager
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: __SESSION__
      component: taskmanager
  template:
    metadata:
      labels:
        app: __SESSION__
        component: taskmanager
    spec:
      securityContext:
        fsGroup: 9999
      containers:
        - name: flink
          image: __FLINK_IMAGE__
          imagePullPolicy: IfNotPresent
          args: [taskmanager]
          envFrom:
            - configMapRef:
                name: __SESSION__-settings
          resources:
            requests:
              cpu: 350m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 752Mi
          volumeMounts:
            - name: state
              mountPath: /stream-state
            - name: logging
              mountPath: /opt/flink/conf/log4j-console.properties
              subPath: log4j-console.properties
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: stream-state
        - name: logging
          configMap:
            name: flink-session-logging
