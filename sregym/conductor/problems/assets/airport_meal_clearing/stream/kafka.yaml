apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  clusterIP: None
  selector:
    app: airport-meal-kafka
  ports:
    - name: kafka
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: airport-meal-kafka
  template:
    metadata:
      labels:
        app: airport-meal-kafka
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: __KAFKA_IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - name: CLUSTER_ID
              value: "__CLUSTER_ID__"
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_OFFSETS_RETENTION_MINUTES
              value: "__OFFSETS_RETENTION_MINUTES__"
            - name: KAFKA_OFFSETS_RETENTION_CHECK_INTERVAL_MS
              value: "__OFFSETS_RETENTION_CHECK_INTERVAL_MS__"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS
              value: "2000"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms96m -Xmx192m"
            - name: KAFKA_JVM_PERFORMANCE_OPTS
              value: "-XX:+UseG1GC -XX:ActiveProcessorCount=2"
          ports:
            - containerPort: 9092
          readinessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 2
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
          volumeMounts:
            - name: broker
              mountPath: /var/lib/kafka/data
            - name: ops
              mountPath: /stream-tools
              readOnly: true
      volumes:
        - name: ops
          configMap:
            name: stream-kafka-tools
  volumeClaimTemplates:
    - metadata:
        name: broker
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
