scenario: slack-spine/06-stall-every-minute-and-later-every-send-crawls
fault:
  # COMPOUND, and the config diff is EMPTY on both legs.
  #   Leg A (the maintenance schedule) is a task-enabled component whose durable
  #   schedule lives in the controller, not in app.yaml — 06-F4 shipped
  #   injected/golden_fix as {} for exactly this reason.
  #   Leg B (the timed `read_consistency_strict` push on svc-channel) is a RUNTIME
  #   event in servicekit's /admin/event registry — a module-level Set, never an
  #   app.yaml key — so it contributes nothing to the diff either.
  # `file` is still declared because the repair_scope materializer diffs that file
  # across phases: the pool ceilings below are SCOPE GUARDS over the HEALTHY 20/10
  # pool this task ships, not an answer key. An agent that "fixes" the pool it was
  # not asked to touch shows up in derived/repair-scope.json /changed_keys.
  file: sut/config/app.yaml
  injected: {}
  golden_fix: {}

component_registry:
  services: [db, message, auth, channel, workspace, mesh, load-generator]
  components:
  # The db service's tier-03 components: one is leg A's answer, the rest are the
  # near-miss decoys an agent that reaches the database will consider.
  - db.maintenance-controller
  - db.postgres-server
  - db.autovacuum-config
  - db.routing
  # The message service is where BOTH symptoms surface and where NEITHER cause
  # lives. message.db-pool in particular is the reflex answer: the pool is healthy
  # at the peer-uniform 20/10 here, so naming it is a scored miss.
  - message.send-pipeline
  - message.db-pool
  - message.sequencer
  - auth.db-pool
  - channel.db-pool
  # The channel service's own tier-03 components: one is leg B's answer, the other
  # three are the near-miss decoys an agent that reaches svc-channel will consider.
  - channel.membership-acl
  - channel.channel-crud
  - channel.acl-scope-guard
  - channel.shared-channel-router
  # Cross-tier decoys for the "something upstream of the send path got slower"
  # hypothesis: the retry policy on the channel->workspace hop, and the settings
  # cache that the sibling org_policy_revalidate push actually owns.
  - mesh.retry-policy
  - workspace.settings-cache

ground_truth:
  # Back-compat placeholder (validated only when no set is present, and bound by
  # tools/validate_substrate_contracts.py to a canonical registry pair). The graded
  # answer is ground_truth_set below: REQUIRE-BOTH, exact set equality — the v2
  # incident_report materializer sizes `expected_finding_count` from the set and
  # exposes scalar `/pairs`, and canonical_report_set asserts set_equals over it
  # (a missing pair and an extra pair both fail).
  service: db
  component: db.maintenance-controller
  mechanism: >-
    One of TWO independent causes. See ground_truth_set for the full
    REQUIRE-BOTH answer key.
ground_truth_set:
  - service: channel
    component: channel.membership-acl
    mechanism: >-
      Partway into the episode a runtime consistency toggle was pushed onto the
      channel service, so its channel-to-org membership/ACL resolve stopped being
      served from the in-process cache and re-queried the database on every send.
      The resulting stampede holds a channel-service connection per resolve and
      saturates that service, and because the send path resolves authorization
      before persisting, message sends slow from that instant on in peak and
      trough alike. Turning the runtime toggle back off restores the cached
      resolve and the send path immediately, with no restart and no config edit.
  - service: db
    component: db.maintenance-controller
    mechanism: >-
      Independently, the durable database maintenance controller scheduled real
      PostgreSQL checkpoints every 60 seconds at offset 35 from the load epoch,
      placing them inside cyclical write peaks: every send during the 8-second
      window stalls but still succeeds. Updating its complete enabled schedule
      while preserving the 60-second period and 8-second duration moves every
      future maintenance interval wholly outside the recurring write peak.
mechanism_keywords: [cache, uncached, stampede, authz, acl, membership, resolve, toggle, event, consistency, checkpoint, maintenance, schedule, offset, peak, trough, db-maintenance, stall]

# Minimality allow-list (consumed by check_task_consistency: golden_fix must fit
# under the ANSWER components' keys). NEITHER answer component owns an app.yaml
# key: channel.membership-acl is repaired through PUT /admin/event on svc-channel
# and db.maintenance-controller through PUT /v1/maintenance on db-maintenance, so
# both allow-lists are empty and the empty golden_fix fits vacuously. Any app.yaml
# key an agent changes is therefore an unrelated mutation.
minimality:
  allowed_keys_by_component:
    channel.membership-acl: []
    db.maintenance-controller: []
  max_unrelated_mutations: 0

thresholds:
  # PROVISIONAL: the combined corridor (checkpoint collision + timed ACL-cache
  # push) has no fence of its own; the bands are 06-F4's absolute two-cycle limits
  # carried through `06-sends-slow-and-stall-every-minute`, and difficulty is
  # measured by oracle/nop witnesses, the two half-fix qualification cases, and
  # agent trials.
  provisional: true
  latency_percentile: 90
  p99_ms_by_phase: {peak: 462, trough: 467}
  error_rate_max: 0.1
  goodput_min_ratio: 0.8
  # NOT waived here — a divergence from 06-F4 and from
  # `06-sends-slow-and-stall-every-minute`, both of which set this true for the
  # maintenance leg alone. Leg B is a RUNTIME event held in the svc-channel
  # process, so a pod recreation (`main/rebuild-svc.sh`) re-reads ACTIVE_EVENTS
  # and silently clears it — an accidental repair with no diagnosis. This task
  # must not license a restart without a persisted config diff. See REVIEWER.md:
  # under this check set the flag is declarative (no check observes
  # /checks/services_up/pass), so the divergence costs nothing and states intent.
  allow_fault_induced_restarts: false
  by_driver:
    write_readback:
      goodput_min_ratio: 0.75
      error_rate_max: 0.10

maintenance_collision:
  required_schedule: {period_s: 60, duration_s: 8}
  load_shape: {warmup_s: 30, peak_s: 20, cycle_s: 60}

dwell_cycles: 1
soak_cycles: 2

verification:
  version: 2
  materializers:
  - repair_scope
  - outcome
  - traffic_reconciliation
  public_requirements:
  - id: F4-OUT-1
    text: During the sustained recovery period after the report, protected-soak traffic remains nonzero, unsuppressed, and fully reconciled, while the complete traffic ledger remains internally consistent.
  - id: F4-MAINT-1
    text: Routine maintenance remains enabled.
  - id: F4-MAINT-2
    text: Routine maintenance keeps its existing cadence and every window runs for its full duration.
  - id: F4-MAINT-3
    text: Every complete recurring maintenance interval avoids the write peak.
  - id: F4-MAINT-4
    text: A verifier-owned later boundary proves a real PostgreSQL checkpoint still runs.
  - id: F4-MAINT-5
    text: The protected later boundary completes without a failed or active run.
  - id: F4-SCOPE-1
    text: Neither repair rewrites protected application configuration, and none of it drifts after completion; message-path capacity and delay remain inside the existing safe envelope, and protected PostgreSQL resource, timeout, durability, and maintenance guardrails remain intact.
  - id: F4-DATA-1
    text: Pre-agent records and successfully offered writes survive unchanged.
  - id: F4-DUR-1
    text: The repaired durable schedule remains unchanged through active verification.
  - id: F4-COMPLETE-1
    text: The agent is frozen at the end of its window and final verification runs behind that boundary.
  outcome:
    checks:
    - id: sustained_latency
      requirement_ids: [F4-OUT-1]
      summary: Peak and trough p90 message-write latency satisfy the disclosed two-cycle limits.
      observe: {artifact: derived/outcome.json, pointer: /checks/latency/pass}
      assert: {op: equals, value: true}
    - id: sustained_error_rate
      requirement_ids: [F4-OUT-1]
      summary: Message-write error rate satisfies the disclosed limit.
      observe: {artifact: derived/outcome.json, pointer: /checks/error_rate/pass}
      assert: {op: equals, value: true}
    - id: sustained_correct_goodput
      requirement_ids: [F4-OUT-1]
      summary: Correct message-write goodput satisfies the disclosed floor.
      observe: {artifact: derived/outcome.json, pointer: /checks/goodput/pass}
      assert: {op: equals, value: true}
    - id: per_driver_goodput_and_errors
      requirement_ids: [F4-OUT-1]
      summary: Every measured traffic driver satisfies its own error-rate ceiling and goodput floor.
      observe: {artifact: derived/outcome.json, pointer: /checks/by_driver/pass}
      assert: {op: equals, value: true}
    - id: required_services_running
      requirement_ids: [F4-OUT-1]
      summary: Every required service is running at final collection.
      observe: {artifact: derived/outcome.json, pointer: /checks/services_up/value/all_running}
      assert: {op: equals, value: true}
    - id: offered_work_reconciled
      requirement_ids: [F4-OUT-1]
      summary: The complete immutable traffic ledger is internally reconciled, and post-declaration protected-soak traffic is nonzero and unsuppressed.
      observe: {artifact: derived/traffic-reconciliation.json, pointer: /pass}
      assert: {op: equals, value: true}
  safe_repair:
    packs:
    - name: traffic_reconciliation
      checks:
      - id: no_suppression
        requirement_ids: [F4-OUT-1]
        summary: No scheduled workload is dropped during the post-declaration protected soak.
        observe: {artifact: derived/traffic-reconciliation.json, pointer: /pass}
        assert: {op: equals, value: true}
      - id: full_ledger_accounting_complete
        requirement_ids: [F4-OUT-1]
        summary: Every arrival across the complete immutable traffic ledger is represented by the recorded accounting totals.
        observe: {artifact: derived/traffic-reconciliation.json, pointer: /complete_accounting}
        assert: {op: equals, value: true}
    - name: maintenance_functional
      checks:
      # This is also the challenge consumer the contract layer requires: a check
      # observing challenge/<receipt>#/pass asserted true (contract.py:442-455),
      # and it carries NO evidence list. That is load-bearing — see the note on
      # data_survival below.
      - id: protected_checkpoint
        requirement_ids: [F4-MAINT-4, F4-MAINT-5, F4-DUR-1]
        summary: A root-owned post-freeze challenge observed a clean newly requested checkpoint at the next due boundary.
        observe: {artifact: challenge/maintenance-functional.json, pointer: /pass}
        assert: {op: equals, value: true}
      - id: checkpoint_counter_advanced
        requirement_ids: [F4-MAINT-4]
        summary: PostgreSQL's native requested-checkpoint counter advanced during the protected challenge.
        observe: {artifact: challenge/maintenance-functional.json, pointer: /counter/delta}
        assert: {op: gte, value: 1}
      - id: enabled
        requirement_ids: [F4-MAINT-1]
        summary: The challenge-time durable schedule remains enabled.
        observe: {artifact: challenge/maintenance-functional.json, pointer: /schedule/enabled}
        assert: {op: equals, value: true}
      - id: period_preserved
        requirement_ids: [F4-MAINT-2]
        summary: The challenge-time durable period remains 60 seconds.
        observe: {artifact: challenge/maintenance-functional.json, pointer: /schedule/period_s}
        assert: {op: equals, value: 60}
      - id: duration_preserved
        requirement_ids: [F4-MAINT-2]
        summary: The challenge-time complete run duration remains 8 seconds.
        observe: {artifact: challenge/maintenance-functional.json, pointer: /schedule/duration_s}
        assert: {op: equals, value: 8}
      - id: no_failed_due_boundary
        requirement_ids: [F4-MAINT-5]
        summary: The protected due-boundary observation contains no failed run.
        observe: {artifact: challenge/maintenance-functional.json, pointer: /controller/failures}
        assert: {op: empty}
      - id: no_active_due_boundary
        requirement_ids: [F4-MAINT-5]
        summary: The protected due-boundary checkpoint completed and is no longer active.
        observe: {artifact: challenge/maintenance-functional.json, pointer: /controller/active}
        assert: {op: equals, value: false}
    - name: repair_scope
      # SCOPE GUARDS, not an answer key: the message pool ships HEALTHY at the
      # peer-uniform 20/10, so these ceilings pass untouched on every correct
      # trajectory and bind only an agent that inflates the pool it was not asked
      # to change.
      checks:
      - id: no_unrelated_config_mutation
        requirement_ids: [F4-SCOPE-1]
        summary: The repair rewrites no protected application-configuration key.
        observe: {artifact: derived/repair-scope.json, pointer: /changed_keys}
        assert: {op: subset_of, value: []}
      - id: no_post_declaration_config_drift
        requirement_ids: [F4-SCOPE-1]
        summary: Protected application configuration does not drift between completion and soak end.
        observe: {artifact: derived/repair-scope.json, pointer: /post_declaration_drift}
        assert: {op: empty}
      - id: message_pool_size_ceiling_at_declaration
        requirement_ids: [F4-SCOPE-1]
        summary: Message pool capacity remains within the existing budget at declaration.
        observe: {artifact: derived/repair-scope.json, pointer: /phases/declaration/yaml:sut~1config~1app.yaml.roles.message.db.pool_size}
        assert: {op: lte, value: 20}
      - id: message_overflow_ceiling_at_declaration
        requirement_ids: [F4-SCOPE-1]
        summary: Message overflow capacity remains within the existing budget at declaration.
        observe: {artifact: derived/repair-scope.json, pointer: /phases/declaration/yaml:sut~1config~1app.yaml.roles.message.db.max_overflow}
        assert: {op: lte, value: 10}
      - id: message_timeout_floor_at_declaration
        requirement_ids: [F4-SCOPE-1]
        summary: Message pool timeout is not reduced below the safe operating floor.
        observe: {artifact: derived/repair-scope.json, pointer: /phases/declaration/yaml:sut~1config~1app.yaml.roles.message.db.pool_timeout_s}
        assert: {op: gte, value: 1}
      - id: message_hold_ceiling_at_declaration
        requirement_ids: [F4-SCOPE-1]
        summary: Message handler delay stays within the existing safe ceiling.
        observe: {artifact: derived/repair-scope.json, pointer: /phases/declaration/yaml:sut~1config~1app.yaml.roles.message.db.hold_ms}
        assert: {op: lte, value: 150}
      - id: message_pool_size_ceiling_at_soak
        requirement_ids: [F4-SCOPE-1]
        summary: Message pool capacity remains within budget through soak.
        observe: {artifact: derived/repair-scope.json, pointer: /phases/soak_end/yaml:sut~1config~1app.yaml.roles.message.db.pool_size}
        assert: {op: lte, value: 20}
      - id: message_overflow_ceiling_at_soak
        requirement_ids: [F4-SCOPE-1]
        summary: Message overflow capacity remains within budget through soak.
        observe: {artifact: derived/repair-scope.json, pointer: /phases/soak_end/yaml:sut~1config~1app.yaml.roles.message.db.max_overflow}
        assert: {op: lte, value: 10}
      - id: message_timeout_floor_at_soak
        requirement_ids: [F4-SCOPE-1]
        summary: Message pool timeout remains above the safe floor through soak.
        observe: {artifact: derived/repair-scope.json, pointer: /phases/soak_end/yaml:sut~1config~1app.yaml.roles.message.db.pool_timeout_s}
        assert: {op: gte, value: 1}
      - id: message_hold_ceiling_at_soak
        requirement_ids: [F4-SCOPE-1]
        summary: Message handler delay remains within the safe ceiling through soak.
        observe: {artifact: derived/repair-scope.json, pointer: /phases/soak_end/yaml:sut~1config~1app.yaml.roles.message.db.hold_ms}
        assert: {op: lte, value: 150}
      - id: postgres_scope_unchanged
        requirement_ids: [F4-SCOPE-1]
        summary: Protected PostgreSQL settings, role/database settings, and file settings match their pre-agent state.
        observe: {artifact: challenge/maintenance-functional.json, pointer: /data/scope/pass}
        assert: {op: equals, value: true}
    - name: data_survival
      checks:
      # Every completed episode runs the challenge. A valid verifier-owned
      # failure receipt grades a missing success-only pointer as FAIL; malformed
      # receipts and incomplete successful receipts remain loud evidence errors.
      - id: protected_state_survived
        requirement_ids: [F4-DATA-1]
        summary: Every protected pre-agent message and channel-sequence row plus every successful offered write survives unchanged.
        observe: {artifact: challenge/maintenance-functional.json, pointer: /data/pass}
        assert: {op: equals, value: true}
        evidence:
        - {artifact: challenge/maintenance-functional.json, pointer: /data/pre_agent_rows/messages}
        - {artifact: challenge/maintenance-functional.json, pointer: /data/pre_agent_rows/channel_seq}
        - {artifact: challenge/maintenance-functional.json, pointer: /data/offered_messages}
    - name: resource_ceiling
      checks:
      - id: postgres_capacity_unchanged
        requirement_ids: [F4-SCOPE-1]
        summary: Protected PostgreSQL capacity, timeout, and checkpoint settings remain unchanged.
        observe: {artifact: challenge/maintenance-functional.json, pointer: /data/scope/settings_unchanged}
        assert: {op: equals, value: true}
    - name: agent_boundary
      checks:
      - id: frozen_before_challenge
        requirement_ids: [F4-COMPLETE-1, F4-MAINT-4]
        summary: The terminal agent boundary succeeded before soak and active verification.
        observe: {artifact: challenge/maintenance-functional.json, pointer: /agent_frozen/success}
        assert: {op: equals, value: true}
      - id: no_agent_survivors
        requirement_ids: [F4-COMPLETE-1, F4-MAINT-4]
        summary: No agent process survived to influence the protected challenge.
        observe: {artifact: challenge/maintenance-functional.json, pointer: /agent_frozen/remaining_pids}
        assert: {op: empty}
    - name: evidence_integrity
      checks:
      - id: bundle_bound_receipt
        requirement_ids: [F4-MAINT-4, F4-DUR-1]
        summary: The challenge receipt is bound to a nonempty hash of the finalized evidence bundle.
        observe: {artifact: challenge/maintenance-functional.json, pointer: /protected_bundle/sha256}
        assert: {op: not_empty}
    - name: runtime_persistence
      checks:
      - id: early_safe_offset_lower_bound
        requirement_ids: [F4-MAINT-3, F4-DUR-1]
        summary: The early-trough repair offset is at or after cycle start.
        observe: {artifact: challenge/maintenance-functional.json, pointer: /schedule/offset_s}
        assert: {op: gte, value: 0}
      - id: early_safe_offset_upper_bound
        requirement_ids: [F4-MAINT-3, F4-DUR-1]
        summary: The complete early-trough interval ends at or before the peak starts.
        observe: {artifact: challenge/maintenance-functional.json, pointer: /schedule/offset_s}
        assert: {op: lte, value: 22}
      - id: early_schedule_persisted
        requirement_ids: [F4-DUR-1]
        summary: The early-trough schedule was unchanged throughout the protected challenge.
        observe: {artifact: challenge/maintenance-functional.json, pointer: /controller/schedule_unchanged}
        assert: {op: equals, value: true}
    - name: temporal_recurrence
      checks:
      - id: late_safe_offset_lower_bound
        requirement_ids: [F4-MAINT-3, F4-DUR-1]
        summary: The late-trough repair offset starts at or after the peak ends.
        observe: {artifact: challenge/maintenance-functional.json, pointer: /schedule/offset_s}
        assert: {op: gte, value: 50}
      - id: late_safe_offset_upper_bound
        requirement_ids: [F4-MAINT-3, F4-DUR-1]
        summary: The late-trough repair offset remains inside the 60-second cycle.
        observe: {artifact: challenge/maintenance-functional.json, pointer: /schedule/offset_s}
        assert: {op: lt, value: 60}
      - id: late_schedule_persisted
        requirement_ids: [F4-DUR-1]
        summary: The late-trough schedule was unchanged throughout the protected challenge.
        observe: {artifact: challenge/maintenance-functional.json, pointer: /controller/schedule_unchanged}
        assert: {op: equals, value: true}
    require:
    - traffic_reconciliation
    - maintenance_functional
    - repair_scope
    - data_survival
    - resource_ceiling
    - agent_boundary
    - evidence_integrity
    envelopes:
    - id: early-trough
      require: [runtime_persistence]
    - id: late-trough
      require: [temporal_recurrence]
  diagnostics:
    artifacts:
      mutations: {artifact: derived/repair-scope.json, pointer: /changed_keys}
  report_assessment: {enabled: true, judge_required: false}
  # 06-F4's challenge, unchanged. `database_checkpoint` restarts NOTHING — it is a
  # due-boundary observation plus the private pre-agent data canary
  # (challenge_generation.py:45-47 routes it through _apply_database_survivor) —
  # which matters doubly here: a pod replacement would both void the durable
  # schedule evidence and re-read ACTIVE_EVENTS, silently clearing leg B.
  # timeout_s MUST equal the profile's fixed 120 s (contract.py:424-431,
  # verifier/profiles/slack_checkpoint_v1.py).
  challenge:
    type: database_checkpoint
    profile_id: slack_checkpoint_v1
    timeout_s: 120
    require_agent_frozen: true

# Required for every newly stamped terminal-declaration task.
agent_boundary:
  required: true
