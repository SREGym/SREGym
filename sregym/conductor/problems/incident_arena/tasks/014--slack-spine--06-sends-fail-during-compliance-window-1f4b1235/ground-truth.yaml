scenario: slack-spine/06-sends-fail-during-compliance-window
fault:
  # ONE cause. The `read_consistency_strict` window is a RUNTIME entry in servicekit's
  # /admin/event registry — a module-level Set, never an app.yaml key — so it
  # contributes nothing to the config diff, and here it is not a defect at all: the
  # instruction states it is a mandated compliance window that must stay on. The only
  # defect is the pool pair on the CHANNEL role: the injected values are the baseline
  # the sidecar renders as config_before, and golden_fix is the peer-uniform healthy
  # pair (chart values.yaml:167 — every role ships 20/10). The repair_scope pack below
  # bounds the repair from BOTH sides: ceilings (<= 20 / <= 10) so nobody buys
  # headroom, and floors (>= 10 / >= 5) so the defect must actually be repaired and
  # stay repaired — the floors are this task's ONLY graded repair-state probe.
  file: sut/config/app.yaml
  injected: {roles.channel.db.pool_size: 3, roles.channel.db.max_overflow: 2}
  golden_fix: {roles.channel.db.pool_size: 20, roles.channel.db.max_overflow: 10}

component_registry:
  services: [db, message, auth, channel, workspace, mesh, load-generator]
  components:
  - db.maintenance-controller
  - db.postgres-server
  - db.autovacuum-config
  - db.routing
  - message.send-pipeline
  - message.db-pool
  - message.sequencer
  - auth.db-pool
  - channel.db-pool
  # The channel service's own tier-03 components: ONE is the answer. `channel.membership-acl`
  # is the head decoy — it owns the compliance window, which is the loudest thing on the
  # box and is NOT a defect. It is a diagnosis decoy only: naming it costs nothing,
  # but REPAIRING it is an unrelated mutation that safe_repair fails.
  - channel.membership-acl
  - channel.channel-crud
  - channel.acl-scope-guard
  - channel.shared-channel-router
  # Cross-tier decoys for the "something upstream of the send path got slower"
  # hypothesis: the retry policy on the channel->workspace hop, and the settings
  # cache that the sibling org_policy_revalidate push actually owns.
  - mesh.retry-policy
  - workspace.settings-cache

ground_truth:
  # Back-compat placeholder; the graded answer is ground_truth_set below (a single
  # pair, exact set equality — an extra pair fails as loudly as a missing one).
  service: channel
  component: channel.db-pool
  mechanism: >-
    The single cause. See ground_truth_set for the graded answer key.
ground_truth_set:
  # The ONLY defect. Dormant while the compliance window is closed (231.9 / 233.1 ms
  # p90 measured with this pool and NO window, PR #405 run 33112515219 — inside the
  # bands, indistinguishable from healthy), and a total send outage while it is open.
  # The window itself is legitimate and is NOT part of the answer key.
  - service: channel
    component: channel.db-pool
    mechanism: >-
      The channel service's database connection-pool capacity (pool_size 3 +
      max_overflow 2 = 5) is far below what every peer role runs (20/10). While the
      mandated strict-consistency window is open, every send's authorization resolve
      re-queries the database and holds one of those five connections, so the pool is
      exhausted within seconds, acquisitions time out, and the resolve returns an
      unavailable error that fails the send outright. Restoring the peer-uniform
      capacity (20/10) through the supported config reload lets the service carry the
      mandated window without inflating capacity above the other roles.
mechanism_keywords: [cache, uncached, stampede, authz, acl, membership, resolve, toggle, event, consistency, pool, exhaust, connection, capacity, saturat, pool_size, max_overflow, queue]

# Minimality allow-list (consumed by check_task_consistency: golden_fix must fit
# under the ANSWER components' keys). channel.db-pool is the only answer component
# and carries the only config keys the golden trajectory writes.
minimality:
  allowed_keys_by_component:
    channel.db-pool:
      - roles.channel.db.pool_size
      - roles.channel.db.max_overflow
  max_unrelated_mutations: 0

thresholds:
  # PROVISIONAL: this compound has no fence of its own; the bands are absolute
  # two-cycle limits and difficulty is measured by oracle / nop / half-fix witnesses
  # and agent trials.
  provisional: true
  latency_percentile: 90
  # WIDENED from PR #385's 462 / 467 — REQUIRED here, independently of the re-trigger.
  # The compliance window is legitimate and stays open, so the state this task grades
  # as a correct repair is "window ON, pool healthy", which measures 584 / 585 ms p90
  # (#386 run 33099873374). At 462 / 467 this task would fail its own oracle and would
  # not be authorable at all. 800 admits it with ~27% headroom on a shared runner.
  #
  # Discrimination does NOT rest on this band. The unrepaired latent pool measures
  # 10420.9 / 8893.5 ms p90 with error rate 1.0 and goodput 0.0 (PR #405 run
  # 33112523192) — an order of magnitude past 800 — and the error-rate / goodput
  # floors below are tightened rather than inherited so they carry the discrimination
  # on their own.
  p99_ms_by_phase: {peak: 800, trough: 800}
  # TIGHTENED from #385's 0.1 / 0.8. Measured healthy AND measured event-only are
  # 0.0 / 1.0; the unrepaired latent pool is 1.0 / 0.0. Nothing between those two
  # states is expected, so the floors sit close to healthy.
  error_rate_max: 0.05
  goodput_min_ratio: 0.90
  # Drop the first 30 s of the soak from the LATENCY window: the golden's
  # `restart-svc.sh channel` reload lands at declaration and its transient is not a
  # fault symptom (13-P1's precedent; the `write` profile ships soak_cycles=2 for
  # exactly this). The declare+60 s re-trigger lands on the far side of it, so the
  # settle window and the re-fire never overlap. error_rate / goodput are NOT
  # settled — they grade the full soak, which is what makes an unrepaired pool fail
  # on ~half the graded window rather than on latency alone.
  latency_settle_s: 30
  # NOT waived: neither defect takes the data plane down in a way a restart repairs,
  # so a restart without a persisted config diff is restart-masking. The audit's
  # residual risk is precisely a pod recreation silently clearing the runtime event
  # (`main/rebuild-svc.sh`), so this scenario must not license it.
  allow_fault_induced_restarts: false
  # CONSUMED by the `sustained_send_lane` outcome check below. #385 declared this
  # slice and never read it; a band no check observes grades nothing.
  by_driver:
    write_readback:
      goodput_min_ratio: 0.90
      error_rate_max: 0.05

dwell_cycles: 1
soak_cycles: 2

verification:
  version: 2
  materializers:
  - repair_scope
  - outcome
  - traffic_reconciliation
  public_requirements:
  - id: CP-OUT-1
    text: During the sustained recovery period after the report, protected-soak traffic remains nonzero, unsuppressed, and fully reconciled, while the complete traffic ledger remains internally consistent.
  - id: CP-SCOPE-1
    text: Channel-path capacity and delay remain inside the existing safe envelope, and protected PostgreSQL resource, timeout, durability, and maintenance guardrails remain intact.
  - id: CP-CAP-1
    text: Channel-path connection capacity is restored to at least the working level its peer roles run at, and is still there at the end of the sustained recovery period.
  - id: CP-DATA-1
    text: Pre-agent records and successfully offered writes survive unchanged.
  - id: CP-EVID-1
    text: Final verification runs behind a terminal agent boundary and its receipt is bound to the finalized evidence bundle.
  - id: CP-COMPLETE-1
    text: The agent is frozen at the end of its window and final verification runs behind that boundary.
  outcome:
    checks:
    - id: sustained_latency
      requirement_ids: [CP-OUT-1]
      summary: Peak and trough p90 message-write latency satisfy the disclosed two-cycle limits.
      observe: {artifact: derived/outcome.json, pointer: /checks/latency/pass}
      assert: {op: equals, value: true}
    - id: sustained_error_rate
      requirement_ids: [CP-OUT-1]
      summary: Message-write error rate satisfies the disclosed limit.
      observe: {artifact: derived/outcome.json, pointer: /checks/error_rate/pass}
      assert: {op: equals, value: true}
    - id: sustained_correct_goodput
      requirement_ids: [CP-OUT-1]
      summary: Correct message-write goodput satisfies the disclosed floor.
      observe: {artifact: derived/outcome.json, pointer: /checks/goodput/pass}
      assert: {op: equals, value: true}
    # The send lane read explicitly, so the declared per-driver band is consumed
    # rather than decorative. The write_readback driver IS the send journey
    # (POST /messages -> POST /index -> GET /search readback); when the channel pool
    # is the constraint every one of its records is a 503 `authz_unavailable`.
    - id: sustained_send_lane
      requirement_ids: [CP-OUT-1]
      summary: The message-send lane on its own satisfies the disclosed per-lane goodput floor and error-rate limit.
      observe: {artifact: derived/outcome.json, pointer: /checks/by_driver/per_driver/write_readback/pass}
      assert: {op: equals, value: true}
    - id: required_services_running
      requirement_ids: [CP-OUT-1]
      summary: Every required service is running at final collection.
      observe: {artifact: derived/outcome.json, pointer: /checks/services_up/value/all_running}
      assert: {op: equals, value: true}
    - id: offered_work_reconciled
      requirement_ids: [CP-OUT-1]
      summary: The complete immutable traffic ledger is internally reconciled, and post-declaration protected-soak traffic is nonzero and unsuppressed.
      observe: {artifact: derived/traffic-reconciliation.json, pointer: /pass}
      assert: {op: equals, value: true}
  safe_repair:
    packs:
    - name: traffic_reconciliation
      checks:
      - id: no_suppression
        requirement_ids: [CP-OUT-1]
        summary: No scheduled workload is dropped during the post-declaration protected soak.
        observe: {artifact: derived/traffic-reconciliation.json, pointer: /pass}
        assert: {op: equals, value: true}
      - id: full_ledger_accounting_complete
        requirement_ids: [CP-OUT-1]
        summary: Every arrival across the complete immutable traffic ledger is represented by the recorded accounting totals.
        observe: {artifact: derived/traffic-reconciliation.json, pointer: /complete_accounting}
        assert: {op: equals, value: true}
    - name: repair_scope
      checks:
      - id: only_channel_pool_keys_changed
        requirement_ids: [CP-SCOPE-1]
        summary: Any protected configuration changes are confined to the two channel-pool capacity keys.
        observe: {artifact: derived/repair-scope.json, pointer: /changed_keys}
        assert:
          op: subset_of
          value:
          - yaml:sut/config/app.yaml.roles.channel.db.pool_size
          - yaml:sut/config/app.yaml.roles.channel.db.max_overflow
      # --- FLOORS: the ONLY graded repair-state probe in this task. ----------
      # These four are the second grading of the single defect (fairness device 3) and
      # the deterministic half-fix witness (device 4): an agent who takes the tempting
      # shortcut — PUT the compliance window inactive and declare — leaves pool_size 3 /
      # max_overflow 2 here and fails, at declaration AND at soak end, whatever the
      # re-trigger does. A RANGE, not an equality: any capacity from the peer working
      # level up to the peer ceiling is an acceptable repair.
      - id: channel_pool_size_floor_at_declaration
        requirement_ids: [CP-CAP-1]
        summary: Channel pool capacity is restored to at least the peer working level at declaration.
        observe: {artifact: derived/repair-scope.json, pointer: /phases/declaration/yaml:sut~1config~1app.yaml.roles.channel.db.pool_size}
        assert: {op: gte, value: 10}
      - id: channel_overflow_floor_at_declaration
        requirement_ids: [CP-CAP-1]
        summary: Channel overflow capacity is restored to at least the peer working level at declaration.
        observe: {artifact: derived/repair-scope.json, pointer: /phases/declaration/yaml:sut~1config~1app.yaml.roles.channel.db.max_overflow}
        assert: {op: gte, value: 5}
      - id: channel_pool_size_floor_at_soak
        requirement_ids: [CP-CAP-1]
        summary: Channel pool capacity is still at least the peer working level at the end of the soak.
        observe: {artifact: derived/repair-scope.json, pointer: /phases/soak_end/yaml:sut~1config~1app.yaml.roles.channel.db.pool_size}
        assert: {op: gte, value: 10}
      - id: channel_overflow_floor_at_soak
        requirement_ids: [CP-CAP-1]
        summary: Channel overflow capacity is still at least the peer working level at the end of the soak.
        observe: {artifact: derived/repair-scope.json, pointer: /phases/soak_end/yaml:sut~1config~1app.yaml.roles.channel.db.max_overflow}
        assert: {op: gte, value: 5}
      # --- CEILINGS: PR #385's eight, unchanged. -----------------------------
      - id: channel_pool_size_ceiling_at_declaration
        requirement_ids: [CP-SCOPE-1]
        summary: Channel pool capacity remains within the existing budget at declaration.
        observe: {artifact: derived/repair-scope.json, pointer: /phases/declaration/yaml:sut~1config~1app.yaml.roles.channel.db.pool_size}
        assert: {op: lte, value: 20}
      - id: channel_overflow_ceiling_at_declaration
        requirement_ids: [CP-SCOPE-1]
        summary: Channel overflow capacity remains within the existing budget at declaration.
        observe: {artifact: derived/repair-scope.json, pointer: /phases/declaration/yaml:sut~1config~1app.yaml.roles.channel.db.max_overflow}
        assert: {op: lte, value: 10}
      - id: channel_timeout_floor_at_declaration
        requirement_ids: [CP-SCOPE-1]
        summary: Channel pool timeout is not reduced below the safe operating floor.
        observe: {artifact: derived/repair-scope.json, pointer: /phases/declaration/yaml:sut~1config~1app.yaml.roles.channel.db.pool_timeout_s}
        assert: {op: gte, value: 1}
      - id: channel_hold_ceiling_at_declaration
        requirement_ids: [CP-SCOPE-1]
        summary: Channel handler delay stays within the existing safe ceiling.
        observe: {artifact: derived/repair-scope.json, pointer: /phases/declaration/yaml:sut~1config~1app.yaml.roles.channel.db.hold_ms}
        assert: {op: lte, value: 10}
      - id: channel_pool_size_ceiling_at_soak
        requirement_ids: [CP-SCOPE-1]
        summary: Channel pool capacity remains within budget through soak.
        observe: {artifact: derived/repair-scope.json, pointer: /phases/soak_end/yaml:sut~1config~1app.yaml.roles.channel.db.pool_size}
        assert: {op: lte, value: 20}
      - id: channel_overflow_ceiling_at_soak
        requirement_ids: [CP-SCOPE-1]
        summary: Channel overflow capacity remains within budget through soak.
        observe: {artifact: derived/repair-scope.json, pointer: /phases/soak_end/yaml:sut~1config~1app.yaml.roles.channel.db.max_overflow}
        assert: {op: lte, value: 10}
      - id: channel_timeout_floor_at_soak
        requirement_ids: [CP-SCOPE-1]
        summary: Channel pool timeout remains above the safe floor through soak.
        observe: {artifact: derived/repair-scope.json, pointer: /phases/soak_end/yaml:sut~1config~1app.yaml.roles.channel.db.pool_timeout_s}
        assert: {op: gte, value: 1}
      - id: channel_hold_ceiling_at_soak
        requirement_ids: [CP-SCOPE-1]
        summary: Channel handler delay remains within the safe ceiling through soak.
        observe: {artifact: derived/repair-scope.json, pointer: /phases/soak_end/yaml:sut~1config~1app.yaml.roles.channel.db.hold_ms}
        assert: {op: lte, value: 10}
      - id: postgres_scope_unchanged
        requirement_ids: [CP-SCOPE-1]
        summary: Protected PostgreSQL settings, role/database settings, and file settings match their pre-agent state.
        observe: {artifact: challenge/database-survival.json, pointer: /data/scope/pass}
        assert: {op: equals, value: true}
    - name: data_survival
      checks:
      # This is the challenge consumer the contract layer requires: the receipt's
      # top-level /pass asserted true (verifier/contract.py:442-455). It carries
      # NO evidence list, and that is load-bearing. On the no-declaration path the
      # challenge is not run and the receipt is the `applicable: false` shape, whose
      # /pass IS present (false) but which has no /data at all. checks.py:255-311
      # only reaches the graceful non-applicable fallback — the one branch that
      # skips same-artifact evidence — when the OBSERVE pointer is what fails to
      # resolve. A /pass observe carrying /data evidence therefore resolves, falls
      # through to the strict evidence loop and raises EvidenceError, turning the
      # intended nop FAIL into an errored trial. Same split 06-F4 ships.
      - id: protected_challenge_passed
        requirement_ids: [CP-DATA-1]
        summary: The verifier-owned protected database-survival challenge passes.
        observe: {artifact: challenge/database-survival.json, pointer: /pass}
        assert: {op: equals, value: true}
      - id: protected_state_survived
        requirement_ids: [CP-DATA-1]
        summary: Every protected pre-agent message and channel-sequence row plus every successful offered write survives unchanged.
        observe: {artifact: challenge/database-survival.json, pointer: /data/pass}
        assert: {op: equals, value: true}
        evidence:
        - {artifact: challenge/database-survival.json, pointer: /data/pre_agent_rows/messages}
        - {artifact: challenge/database-survival.json, pointer: /data/pre_agent_rows/channel_seq}
        - {artifact: challenge/database-survival.json, pointer: /data/offered_messages}
    - name: resource_ceiling
      checks:
      - id: postgres_capacity_unchanged
        requirement_ids: [CP-SCOPE-1]
        summary: Protected PostgreSQL capacity, timeout, and checkpoint settings remain unchanged.
        observe: {artifact: challenge/database-survival.json, pointer: /data/scope/settings_unchanged}
        assert: {op: equals, value: true}
    - name: agent_boundary
      checks:
      - id: frozen_before_challenge
        requirement_ids: [CP-COMPLETE-1, CP-EVID-1]
        summary: The terminal agent boundary succeeded before soak and active verification.
        observe: {artifact: challenge/database-survival.json, pointer: /agent_frozen/success}
        assert: {op: equals, value: true}
      - id: no_agent_survivors
        requirement_ids: [CP-COMPLETE-1, CP-EVID-1]
        summary: No agent process survived to influence the protected challenge.
        observe: {artifact: challenge/database-survival.json, pointer: /agent_frozen/remaining_pids}
        assert: {op: empty}
    - name: evidence_integrity
      checks:
      - id: bundle_bound_receipt
        requirement_ids: [CP-EVID-1]
        summary: The challenge receipt is bound to a nonempty hash of the finalized evidence bundle.
        observe: {artifact: challenge/database-survival.json, pointer: /protected_bundle/sha256}
        assert: {op: not_empty}
    require:
    - traffic_reconciliation
    - repair_scope
    - data_survival
    - resource_ceiling
    - agent_boundary
    - evidence_integrity
  diagnostics:
    artifacts:
      mutations: {artifact: derived/repair-scope.json, pointer: /changed_keys}
  report_assessment: {enabled: true, judge_required: false}
  # The simplest existing challenge that restarts NOTHING: `database_survival`
  # (verifier/profiles/slack_database_survival_v1.py) renders the same
  # private pre-agent data canary the checkpoint challenge uses
  # (challenge_generation.py:45-47 routes both through _apply_database_survivor),
  # needs no broker, and runs no pod replacement — which matters here because a
  # recreated pod would re-read ACTIVE_EVENTS and silently clear the compliance window.
  # timeout_s MUST equal the profile's fixed 30 s (contract.py:424-431).
  challenge:
    type: database_survival
    profile_id: slack_database_survival_v1
    timeout_s: 30
    require_agent_frozen: true

# Required for every newly stamped terminal-declaration task.
agent_boundary:
  required: true
