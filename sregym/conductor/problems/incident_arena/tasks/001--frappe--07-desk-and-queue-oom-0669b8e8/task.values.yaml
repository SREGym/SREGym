# --- fault and workload settings ---
loadgen:
  profilesYaml: "profiles:\n  frappe_jobs_agent:\n    base: frappe_jobs\n    loop:\
    \ true\n    declare_deadline_s: 3690.0\n    soak_cycles: 3\n"
  profile: frappe_jobs_agent
  enabled: true
erpnext:
  mariadb-subchart:
    primary:
      extraFlags: --max-user-connections=500
  redis-queue:
    master:
      extraFlags:
      - --maxmemory
      - 2mb
      - --maxmemory-policy
      - noeviction
      persistence:
        enabled: true
  worker:
    default:
      replicaCount: 0
    short:
      replicaCount: 0
    long:
      replicaCount: 1
      supervise: true
      resources:
        requests:
          cpu: 250m
        limits:
          cpu: 1000m
    scheduler:
      replicaCount: 0
  socketio:
    replicaCount: 0
faultInit:
  mariadb:
    enabled: true
    kind: global_variable
    variable: max_user_connections
    value: 8
# --- agent access settings ---
agentSurface:
  profile: confined
# --- grading-harness settings ---
gradingHarness:
  podState:
    enabled: true
  answerKey:
    enabled: true
  dbState:
    enabled: true
  lockState:
    enabled: false
  verifierEvidence:
    persistent: true
    size: 256Mi
# --- agent report vocabulary ---
agentReport:
  vocabulary:
    services:
    - frappe-web
    - frappe-worker-short
    - frappe-worker-default
    - frappe-worker-long
    - frappe-scheduler
    - frappe-socketio
    - mariadb
    - redis-cache
    - redis-queue
    - network
    - load-generator
    components:
    - frappe-web.db-conn
    - frappe-web.handler
    - frappe-web.config
    - frappe-worker-short.db-conn
    - frappe-worker-short.rq-queue
    - frappe-worker-default.db-conn
    - frappe-worker-default.rq-queue
    - frappe-worker-long.db-conn
    - frappe-worker-long.rq-queue
    - frappe-scheduler.tick
    - frappe-scheduler.db-conn
    - frappe-socketio.affinity
    - frappe-socketio.config
    - mariadb.max-connections
    - mariadb.max-user-connections
    - mariadb.config
    - mariadb.storage
    - redis-cache.config
    - redis-queue.config
    - mariadb.txn-isolation
    - mariadb.wait-timeout
    - mariadb.buffer-pool
    - mariadb.statement-time
    - network
# --- pinned-image settings ---
global:
  imagePullPolicy: IfNotPresent
images:
  main: ghcr.io/abundant-ai/sre-world/frappe-main@sha256:d40b49eb1c050f14d4fa91ad5bb894ee1db61724466caea903ee0a952574210e
  loadgen: ghcr.io/abundant-ai/sre-world/frappe-loadgen@sha256:0372494536eb9a0b40745cdc92a1915ec5b144a67f8bc509845eba5e411b310c
  obsMcp: ghcr.io/abundant-ai/sre-world/frappe-obs-mcp@sha256:1646a2a67d5d0e484dc1b760c2900cb756c7986e9a86cead61175b2737883808
  frappeAdmin: ghcr.io/abundant-ai/sre-world/frappe-admin-sidecar@sha256:9975944f1d375dea6afb9c35159f978c4d82691f232e4818ff7faff66121cd2d
platformTools:
  enabled: true
  image: ghcr.io/abundant-ai/sre-world/codex-tools@sha256:c0ed85e5280e4d70c3ec341288fd240d2d64647d952db3712f94cd27c9c08d64
  digest: sha256:c0ed85e5280e4d70c3ec341288fd240d2d64647d952db3712f94cd27c9c08d64
