# --- fault and workload settings ---
main:
  enableServiceLinks: false
resources:
  loadgen:
    requests:
      cpu: 150m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
loadgen:
  profilesYaml: "profiles:\n  logins_unread_sends_slow:\n    base: bc1_distractor_eval\n\
    \    events:\n    - kind: admin_event\n      fire_at_s: 40.0\n      duration_s:\
    \ 0.0\n      event_name: store_consistency_strict\n      target_service: svc-auth\n\
    \      event_id: strict_store_auth\n    - kind: admin_event\n      fire_at_s:\
    \ 40.0\n      duration_s: 0.0\n      event_name: store_consistency_strict\n  \
    \    target_service: svc-workspace\n      event_id: strict_store_workspace\n \
    \   - kind: admin_event\n      fire_at_s: 40.0\n      duration_s: 0.0\n      event_name:\
    \ store_consistency_strict\n      target_service: svc-notification\n      event_id:\
    \ strict_store_notification\n    declare_deadline_s: 3690.0\n    soak_cycles:\
    \ 3\n"
  profile: logins_unread_sends_slow
app:
  roles:
    auth:
      env:
        STORE_HOLD_MS: '250'
    workspace:
      env:
        STORE_HOLD_MS: '250'
    notification:
      env:
        STORE_HOLD_MS: '250'
# --- agent access settings ---
agentSurface:
  profile: confined
# --- grading-harness settings ---
gradingHarness:
  podState:
    enabled: true
  answerKey:
    enabled: true
  dbState:
    enabled: false
  lockState:
    enabled: false
  verifierEvidence:
    persistent: true
    size: 256Mi
# --- agent report vocabulary ---
agentReport:
  vocabulary:
    services:
    - redis
    - auth
    - workspace
    - notification
    - message
    - channel
    - db
    - load-generator
    components:
    - redis.cache-policy
    - redis.redis-server
    - auth.session-store-client
    - auth.login-handler
    - auth.jwks-cache
    - workspace.settings-cache
    - workspace.membership-loader
    - notification.counter
    - notification.fanout
    - message.send-pipeline
    - message.db-pool
    - channel.membership-acl
    - channel.channel-crud
    - db.postgres-server
# --- pinned-image settings ---
global:
  imagePullPolicy: IfNotPresent
images:
  app: ghcr.io/abundant-ai/sre-world/slack-app@sha256:e050b1d953721145ee580e1baf1e424c55aa31c37a15c909e296c9607c8f7f4a
  appBuilder: ghcr.io/abundant-ai/sre-world/slack-app-builder@sha256:5201d7a4c6e4313c2b9d01209ff6aed413af6f4cc2e11d667631f0ce4920fa07
  go: ghcr.io/abundant-ai/sre-world/slack-go@sha256:a9c60cefb4326ff918867ab522e05a9570b5b50fccc6208372228ed341d123dd
  py: ghcr.io/abundant-ai/sre-world/slack-py@sha256:c3a51b1ab5082f337ae5e8c1f2d60467273b1e73440580fc7e1132564b943c12
  main: ghcr.io/abundant-ai/sre-world/slack-main@sha256:e3dec9737ddfb496b7c380ff529248bf4216514f0d0127f91e41973c05d940f9
  obsMcp: ghcr.io/abundant-ai/sre-world/slack-obs-mcp@sha256:891670f269e57db65d9a2a896472d91a876efb9896f139efd5e503a3b9818ae9
  loadgen: ghcr.io/abundant-ai/sre-world/slack-loadgen@sha256:5a8bfa7e291a3e9ddc32eca99d291531964f08e3b1e269bd59fc9236a1eebbd2
  pgbouncer: ghcr.io/abundant-ai/sre-world/slack-pgbouncer@sha256:70dc0e4aefb23ba0646a3410358732ba8358f3b8aa95b8595f2decbba56ceff0
