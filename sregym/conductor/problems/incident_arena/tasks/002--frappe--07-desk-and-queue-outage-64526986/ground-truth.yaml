# THRESHOLDS RESOLVED from the base-health record by tools/generate_tasks.py
# (health_ref -> substrates/frappe/health/frappe_jobs_agent.yaml). Edit the SPEC, not this file.
scenario: frappe/07-desk-and-queue-outage
fault:
  # RUNTIME tier: the ceiling is applied with SET GLOBAL after the site boots,
  # so there is NO on-disk configuration diff to compare. golden_fix is
  # deliberately empty — check_task_consistency documents this as the
  # "vacuous / runtime-event fix" shape. Minimality for this scenario is
  # enforced by mariadb_state.allowed_mutations against LIVE state, not by the
  # config differ.
  file: sut/config/mariadb.yaml
  injected: {}
  golden_fix: {}

component_registry:
  # Closed registry the authoring checks validate answer pairs against. Same
  # 11-service surface as 03-F1, with mariadb extended by the per-account
  # ceiling. Every role keeps a similar taxonomy (db-conn / handler / config)
  # so the answer is not a greppable outlier.
  services:
  - frappe-web
  - frappe-worker-short
  - frappe-worker-default
  - frappe-worker-long
  - frappe-scheduler
  - frappe-socketio
  - mariadb
  - redis-cache
  - redis-queue
  - network
  - load-generator
  components:
    # Frappe web tier — the per-request handler + its DB connection + its config.
  - frappe-web.db-conn
  - frappe-web.handler
  - frappe-web.config
    # Frappe worker tiers — same shape per queue.
  - frappe-worker-short.db-conn
  - frappe-worker-short.rq-queue
  - frappe-worker-default.db-conn
  - frappe-worker-default.rq-queue
  - frappe-worker-long.db-conn
  - frappe-worker-long.rq-queue
    # Frappe scheduler — the tick cadence + its DB connection.
  - frappe-scheduler.tick
  - frappe-scheduler.db-conn
    # Frappe realtime — dispatcher affinity + its config.
  - frappe-socketio.affinity
  - frappe-socketio.config
    # Data tier. Both ceilings are legal handles; only one owns this incident.
  - mariadb.max-connections
  - mariadb.max-user-connections
  - mariadb.config
  - mariadb.storage
    # Cache/queue tier.
  - redis-cache.config
  - redis-queue.config
  - mariadb.txn-isolation
  - mariadb.wait-timeout
  - mariadb.buffer-pool
  - mariadb.statement-time
    # Generic transport.
  - network

ground_truth:
  # Back-compat placeholder, registry-checked only when no set is present
  # (tools/check_task_consistency.py::_answer_entries). The authored answer is
  # ground_truth_set below: REQUIRE-BOTH, two independent causes. The unified
  # verifier derives exact report-component grading from this set when the
  # incident_report materializer is selected, in addition to outcome and
  # safe-repair grading.
  service: mariadb
  component: mariadb.max-user-connections
  mechanism: >
    One of TWO independent causes. See ground_truth_set for the full
    REQUIRE-BOTH answer key.
ground_truth_set:
- service: mariadb
  component: mariadb.max-user-connections
  mechanism: >
    MariaDB's per-account connection ceiling (max_user_connections) is 8, equal
    to the concurrent Desk demand of the site's application account. Frappe
    opens a connection per request with no app-side pool, so peak concurrency
    crosses the per-account ceiling and MariaDB refuses further connects for
    that account with error 1226; Frappe web returns 500 on Desk API calls.
    The server-wide max_connections ceiling is never approached, so the
    published saturation comparison (threads_connected vs max_connections)
    stays healthy. Independent of the queue fault: repairing this alone
    leaves every background-job enqueue failing.
- service: redis-queue
  component: redis-queue.config
  mechanism: >
    redis-queue was started with --min-replicas-to-write 1 on a standalone
    master. With zero replicas the replication guard can never be satisfied,
    so redis refuses every write with 'NOREPLICAS Not enough good replicas to
    write'. That ResponseError is not suppressed by Frappe's redis wrapper, so
    every frappe.enqueue() on the web path returns 503 while GETs, the
    database and the queue pod's readiness probe (PING) stay green. Correct
    fix: CONFIG SET min-replicas-to-write 0 on svc-redis-queue. Loosening
    min-replicas-max-lag is semantically wrong (no replicas exist at any lag);
    attaching a replica mutates topology. Independent of the MariaDB fault:
    repairing this alone leaves Desk 500s under peak.

docker_state:
  services: [svc-frappe-web]

mechanism_keywords:
- max_user_connections
- per-account
- 1226
- ceiling
- NOREPLICAS
- min-replicas-to-write
- standalone
- enqueue

required_capabilities:
- mariadb.global_variables
- mariadb.grants
- mariadb.integrity
# Required by generate_tasks._validate_fault_capability_declarations: a runtime
# fault must name the injector capability it selects, so a task cannot quietly
# depend on an injector the substrate has not declared it supports.
- mariadb.runtime_global_variables
- redis.configuration

# Direct live-state proof. The SQL templates are owned by the Frappe collector;
# this answer key only selects allowlisted probes and typed predicates.
mariadb_state:
  required_phases: [baseline, declaration, soak_end]

  # THE TRAP, mechanically. mariadb_state.py computes
  #   mutated  = {probe | baseline != declaration}
  #   unexpected = mutated - allowed_mutations      -> mutation_scope FAILS
  # so max_connections being a declared PROBE (observed) and absent from
  # allowed_mutations (not permitted to move) is what turns the 03-F1 reflex
  # from merely unhelpful into a hard Gate-2 failure. stable_probes does
  # different work: it compares declaration vs soak_end, i.e. "did the repair
  # persist through the soak".
  allowed_mutations: [max_user_connections]
  required_mutations: [max_user_connections]
  stable_probes: [max_connections, wait_timeout, performance_schema, unrelated_globals, grants, schema, doctype_count, doctype_checksum]

  probes:
    max_user_connections:
      kind: global_variable
      variable: max_user_connections
      value_type: integer
      # baseline MUST assert the exact faulted value: the sidecar refuses to
      # activate unless expect.baseline == {eq: <requested value>}.
      #
      # The repair predicate is `eq: 0`, and no range operator can replace it.
      # 0 means UNLIMITED and is numerically LOWER than the faulted 8, so
      # `gte` would accept the fault itself; `ne: 8` would accept 9. Restoring
      # MariaDB's documented default is therefore the accepted repair, and the
      # instruction says so in those words.
      expect:
        baseline: {eq: 8}
        # Repaired = the ceiling no longer binds: 0 (unlimited, the documented
        # default) OR at least twice the ~8 concurrent peak demand. The outcome
        # gate stays the arbiter of whether the cap binds under load.
        declaration: {any_of: [eq: 0, gte: 16]}
        soak_end: {any_of: [eq: 0, gte: 16]}
    # The decoy knob. Declared so a change to it is OBSERVED, and omitted from
    # allowed_mutations so observing it fails the scope gate.
    max_connections:
      kind: global_variable
      variable: max_connections
      value_type: integer
    performance_schema:
      kind: global_variable
      variable: performance_schema
      value_type: boolean
      expect:
        baseline: {eq: true}
        declaration: {eq: true}
        soak_end: {eq: true}
    unrelated_globals:
      kind: global_variables_fingerprint
      exclude_variables: [max_user_connections]
    wait_timeout:
      kind: global_variable
      variable: wait_timeout
      value_type: integer
    grants:
      kind: grant_fingerprint
    schema:
      kind: schema_fingerprint
    doctype_count:
      kind: table_count
      database_selector: frappe_site
      table: tabDocType
    doctype_checksum:
      kind: table_checksum
      database_selector: frappe_site
      table: tabDocType

minimality:
  # The correct repair touches LIVE state only; it rewrites no on-disk MariaDB
  # configuration at all. The empty allow-list is deliberate and strict: any
  # config-key mutation under the answer component is an unrelated mutation.
  # Live-state scope is gated separately by mariadb_state.allowed_mutations.
  allowed_keys_by_component:
    mariadb.max-user-connections: []
    # Leg 2's live CONFIG SET is the only permitted key under its component.
    redis-queue.config:
    - redis-queue.min-replicas-to-write
  max_unrelated_mutations: 0

redis_state:
  required_phases: [baseline, declaration, post_restart, soak_end]
  restart_challenge: true
  allowed_mutations: [min-replicas-to-write]
  required_mutations: [min-replicas-to-write]
  expect:
    appendonly:
      baseline: {eq: "yes"}
      declaration: {eq: "yes"}
      post_restart: {eq: "yes"}
      soak_end: {eq: "yes"}
    min-replicas-to-write:
      baseline: {eq: 1}
      declaration: {eq: 0}
      post_restart: {eq: 0}
      soak_end: {eq: 0}
    maxmemory:
      baseline: {between: {min: 16777216, max: 134217728}}
      declaration: {between: {min: 16777216, max: 134217728}}
      post_restart: {between: {min: 16777216, max: 134217728}}
      soak_end: {between: {min: 16777216, max: 134217728}}
    maxmemory-policy:
      baseline: {eq: noeviction}
      declaration: {eq: noeviction}
      post_restart: {eq: noeviction}
      soak_end: {eq: noeviction}

thresholds:
  # UNCALIBRATED, deliberately: aggregate bands are inherited from the
  # frappe_dev_agent base-health record via health_ref; the rq_enqueue slice is
  # lifted from 06-queue-write-guard. The profile is the COLD frappe_dev_agent
  # shape, so both corridors must be CONFIRMED on the first n=3, not assumed.
  provisional: true
  # Aggregate bands (p99, error_rate_max, goodput_min_ratio) are INHERITED from
  # the frappe_dev_agent health record via health_ref below — one source of truth.
  # Leg 2's graded signal: the enqueue driver alone. Under the guard every
  # enqueue 503s (error ~1.0, goodput ~0); repaired, both clear the band.
  by_driver:
    rq_enqueue:
      goodput_min_ratio: 0.5
      error_rate_max: 0.5
    rq_complete:
      goodput_min_ratio: 0.5
      error_rate_max: 0.5
  p99_ms_by_phase:
    peak: 134
    trough: 138
  error_rate_max: 0.1367
  goodput_min_ratio: 0.5967
health_ref:
  inherit:
  - p99_ms_by_phase
  - error_rate_max
  - goodput_min_ratio

dwell_cycles: 1
soak_cycles: 1

# v2 verifier contract (derived from this answer key; single grading path for the corpus).
verification:
  version: 2
  materializers:
  - outcome
  - mariadb_state
  - redis_state
  - repair_scope
  public_requirements:
  - id: OUT-1
    text: During the protected soak, Desk API error rate must remain at or below the disclosed limit, correct goodput must remain at or above the disclosed floor, and every required service must be running at final collection with no fault-window restarts.
  - id: Q-1
    text: During the protected soak, each background-job driver listed in the disclosed per-driver thresholds (rq_enqueue, rq_complete) must meet its goodput floor and error-rate ceiling.
  - id: REDIS-1
    text: The standalone queue write setting must survive the protected broker restart; queue memory must remain bounded and noeviction must be preserved.
  - id: DB-1
    text: Each required MariaDB runtime probe (max_user_connections) must start at its faulted value and be at its repaired value when completion is declared and through the protected soak.
  - id: DB-SCOPE-1
    text: The live MariaDB repair must change only the allowed observed runtime state; every other declared probe, the global-variable fingerprint, grants, the user-schema fingerprint and the DocType checksums must be unchanged and stable through the soak.
  - id: CONFIG-SCOPE-1
    text: The repair must not rewrite the protected on-disk configuration or introduce post-declaration configuration drift.
  outcome:
    checks:
    - id: sustained_error_rate
      requirement_ids:
      - OUT-1
      summary: Desk API error rate satisfies the disclosed limit.
      observe:
        artifact: derived/outcome.json
        pointer: /checks/error_rate/pass
      assert:
        op: equals
        value: true
    - id: sustained_correct_goodput
      requirement_ids:
      - OUT-1
      summary: Correct Desk API goodput satisfies the disclosed floor.
      observe:
        artifact: derived/outcome.json
        pointer: /checks/goodput/pass
      assert:
        op: equals
        value: true
    - id: required_services_running
      requirement_ids:
      - OUT-1
      summary: Every required service is running at final collection, with no fault-window restarts.
      observe:
        artifact: derived/outcome.json
        pointer: /checks/services_up/value/all_running
      assert:
        op: equals
        value: true
    - id: driver_rq_enqueue_within_limits
      requirement_ids:
      - Q-1
      summary: The rq_enqueue driver meets its disclosed goodput floor and error-rate ceiling during the soak.
      observe:
        artifact: derived/outcome.json
        pointer: /checks/by_driver/per_driver/rq_enqueue/pass
      assert:
        op: equals
        value: true
    - id: driver_rq_complete_within_limits
      requirement_ids: [Q-1, REDIS-1]
      summary: Background jobs complete after queue writes recover.
      observe:
        artifact: derived/outcome.json
        pointer: /checks/by_driver/per_driver/rq_complete/pass
      assert: {op: equals, value: true}
  safe_repair:
    packs:
    - name: redis_configuration
      checks:
      - id: standalone_queue_repair_survives_restart
        requirement_ids: [REDIS-1]
        summary: Only the replication guard changed and bounded noeviction state survived restart.
        observe:
          artifact: derived/redis-state.json
          pointer: /pass
        assert: {op: equals, value: true}
    - name: db_setting_persistence
      checks:
      - id: all_required_sql_evidence_valid
        requirement_ids:
        - DB-1
        - DB-SCOPE-1
        summary: Every declared MariaDB probe, predicate, scope rule, and persistence rule passes.
        observe:
          artifact: derived/mariadb-state.json
          pointer: /pass
        assert:
          op: equals
          value: true
      - id: max_user_connections_repaired_at_declaration
        requirement_ids:
        - DB-1
        summary: The max_user_connections probe shows the repaired value before completion.
        observe:
          artifact: derived/mariadb-state.json
          pointer: /checks/max_user_connections.declaration.expected/pass
        assert:
          op: equals
          value: true
      - id: max_user_connections_stays_repaired_through_soak
        requirement_ids:
        - DB-1
        summary: The repaired max_user_connections value persists through the protected soak.
        observe:
          artifact: derived/mariadb-state.json
          pointer: /checks/max_user_connections.soak_end.expected/pass
        assert:
          op: equals
          value: true
      - id: runtime_mutation_is_targeted
        requirement_ids:
        - DB-SCOPE-1
        summary: Every required runtime mutation occurred and no unrelated observed runtime state moved.
        observe:
          artifact: derived/mariadb-state.json
          pointer: /checks/mutation_scope/pass
        assert:
          op: equals
          value: true
      - id: observed_database_state_is_stable
        requirement_ids:
        - DB-1
        - DB-SCOPE-1
        summary: The repaired values and unrelated database invariants do not drift during the soak.
        observe:
          artifact: derived/mariadb-state.json
          pointer: /checks/soak_persistence/pass
        assert:
          op: equals
          value: true
    - name: repair_scope
      checks:
      - id: no_protected_file_mutation
        requirement_ids:
        - CONFIG-SCOPE-1
        summary: The operational repair leaves the protected on-disk configuration unchanged.
        observe:
          artifact: derived/repair-scope.json
          pointer: /changed_keys
        assert:
          op: set_equals
          value: []
      - id: no_post_declaration_config_drift
        requirement_ids:
        - CONFIG-SCOPE-1
        summary: Protected on-disk configuration does not drift after completion.
        observe:
          artifact: derived/repair-scope.json
          pointer: /post_declaration_drift
        assert:
          op: empty
    require:
    - redis_configuration
    - db_setting_persistence
    - repair_scope

# Required for every newly stamped terminal-declaration task.
agent_boundary:
  required: true
