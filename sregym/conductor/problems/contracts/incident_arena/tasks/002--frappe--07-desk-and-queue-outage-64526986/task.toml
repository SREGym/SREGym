schema_version = "1.3"

[task]
name = "sre-world/frappe-07-desk-queue-outage"
description = "Frappe ERP framework deployed as a Helm chart on an ephemeral k8s cluster (upstream frappe/helm@v8.0.65 + SRE-World overlays). COMPOUND incident with two independent root causes that must BOTH be found, repaired and reported: a MariaDB per-account connection ceiling that refuses the application's database account under cyclical Desk-API load, and a redis-queue write guard (min-replicas-to-write on a standalone master) that makes every background job enqueue fail. Repairing one and declaring fails the outcome soak on the other; naming one fails set attribution as \"missing\". Operator-shell agent; out-of-band loadgen; deterministic verifier (outcome bands + repair scope)."
authors = [{ name = "Andre Fu", email = "andrefu.af@hotmail.com" }]
keywords = ["sre", "incident-response", "root-cause", "sre-world", "helm", "kubernetes"]

[metadata]
scenario = "frappe/07-desk-and-queue-outage"
slice = "1"
causal_distance = 4
temporal_emergence = true
fault_presentation = "committed"
profile = "frappe_jobs_agent"
agent_window_s = 3600.0
soak_s = 180.0
agent_surface = "confined"
platform_tools_digest = "sha256:c0ed85e5280e4d70c3ec341288fd240d2d64647d952db3712f94cd27c9c08d64"
oddish_agent_egress_allowed_hosts = ["archive.ubuntu.com", "security.ubuntu.com", "downloads.claude.ai", "api.openai.com", "ab.chatgpt.com", "api.anthropic.com", "mcp-proxy.anthropic.com", "generativelanguage.googleapis.com", "x.ai", "api.x.ai", "api.fireworks.ai", "api.deepseek.com", "api.z.ai", "api.minimax.io", "api.moonshot.ai", "openrouter.ai", "api.ai.meta.com", "api.meta.ai", "lookaside.facebook.com", "bedrock-runtime.us-east-1.amazonaws.com", "bedrock.us-east-1.amazonaws.com", "bedrock-runtime.us-west-2.amazonaws.com", "bedrock.us-west-2.amazonaws.com", "sts.amazonaws.com", "antigravity-unleash.goog", "play.googleapis.com", "playwright.azureedge.net", "playwright-akamai.azureedge.net", "playwright-verizon.azureedge.net"]
open_internet_justification = "The Kubernetes environment needs public connectivity for trusted harness installation and model APIs; the task-owned egress proxy confines the agent to agentEgressProxy.allowedHosts from pod start."

[environment]
build_timeout_sec = 3600.0
cpus = 8
memory_mb = 16384
storage_mb = 76800
workdir = "/home/agent"
network_mode = "public"

[environment.kwargs]
chart_path = "chart"
namespace = "default"
main_selector = "app.kubernetes.io/component=main"
main_container = "main"
values_files = ["task.values.yaml"]
load_images = []
helm_timeout = "1800s"
cluster_create_timeout_sec = 600
ready_timeout_sec = 900

[[environment.mcp_servers]]
name = "observability"
transport = "streamable-http"
url = "http://obs-mcp:8000/mcp"

[environment.healthcheck]
command = "((curl -fsS loadgen:9100/healthz >/dev/null) || { rc=$?; printf 'FATAL: readiness check loadgen-healthz failed (rc=%s)\\n' \"$rc\" >&2; exit \"$rc\"; } && (curl -fsS svc-frappe-web:8000/api/method/ping || exit 1) || { rc=$?; printf 'FATAL: readiness check frappe-web-ping failed (rc=%s)\\n' \"$rc\" >&2; exit \"$rc\"; }) && curl --unix-socket /run/verifier-broker/grader.sock -fsS -X POST http://localhost/grader/episode-start >/dev/null"
interval_sec = 3.0
timeout_sec = 10.0
start_period_sec = 120.0
retries = 260

[agent]
user = "agent"
timeout_sec = 3930.0

[verifier]
environment_mode = "shared"
user = "root"
timeout_sec = 4770.0

[verifier.env]
LOADGEN_GRADER_URL = "http://loadgen:9100"
GRADER_BROKER_SOCKET = "/run/verifier-broker/grader.sock"

[solution.env]
