# --- agent access settings ---
agentSurface:
  profile: confined
# --- grading-harness settings ---
gradingHarness:
  podState:
    enabled: true
  answerKey:
    enabled: true
  dbState:
    enabled: false
  lockState:
    enabled: true
  verifierEvidence:
    persistent: true
    size: 256Mi
  verifierChallenge:
    enabled: true
    targetPod: svc-message-0
    targetService: svc-message
    readinessPath: /healthz
    timeoutSec: 180
    channels: chan-0,chan-1
# --- agent report vocabulary ---
agentReport:
  vocabulary:
    services:
    - message
    - auth
    - channel
    - db
    - redis
    - load-generator
    components:
    - message.sequencer
    - message.db-pool
    - message.send-pipeline
    - db.postgres-server
    - db.locks
    - auth.db-pool
    - channel.db-pool
    - redis.config
    - network
