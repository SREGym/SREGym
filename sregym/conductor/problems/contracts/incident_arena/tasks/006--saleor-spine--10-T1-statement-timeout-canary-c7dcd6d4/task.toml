schema_version = "1.3"

[task]
name = "sre-world/saleor-spine-10t1-statement-timeout-canary"
description = "Diagnose intermittent checkout failures under cyclical Saleor traffic and make a narrow, durable repair from the confined operator shell."
authors = [{ name = "Andre Fu", email = "andrefu.af@hotmail.com" }]
keywords = ["sre", "incident-response", "root-cause", "sre-world", "helm", "kubernetes"]

[metadata]
scenario = "saleor-spine/10-T1-statement-timeout-canary"
slice = "1"
causal_distance = 3
temporal_emergence = true
fault_presentation = "committed"
profile = "saleor_timeout_eval"
agent_window_s = 3600.0
soak_s = 193.0
agent_surface = "confined"
platform_tools_digest = "sha256:c0ed85e5280e4d70c3ec341288fd240d2d64647d952db3712f94cd27c9c08d64"
oddish_agent_egress_allowed_hosts = ["archive.ubuntu.com", "security.ubuntu.com", "deb.debian.org", "downloads.claude.ai", "api.openai.com", "ab.chatgpt.com", "api.anthropic.com", "mcp-proxy.anthropic.com", "generativelanguage.googleapis.com", "x.ai", "api.x.ai", "api.fireworks.ai", "api.deepseek.com", "api.z.ai", "api.minimax.io", "api.moonshot.ai", "openrouter.ai", "api.ai.meta.com", "api.meta.ai", "lookaside.facebook.com", "bedrock-runtime.us-east-1.amazonaws.com", "bedrock.us-east-1.amazonaws.com", "bedrock-runtime.us-west-2.amazonaws.com", "bedrock.us-west-2.amazonaws.com", "sts.amazonaws.com", "antigravity-unleash.goog", "play.googleapis.com", "playwright.azureedge.net", "playwright-akamai.azureedge.net", "playwright-verizon.azureedge.net"]
open_internet_justification = "The Kubernetes environment needs public connectivity for trusted harness installation and model APIs; the task-owned egress proxy confines the agent to agentEgressProxy.allowedHosts from pod start."

[environment]
build_timeout_sec = 2700.0
cpus = 8
memory_mb = 16384
storage_mb = 40960
workdir = "/home/agent"
network_mode = "public"

[environment.kwargs]
chart_path = "chart"
namespace = "default"
main_selector = "app.kubernetes.io/component=main"
main_container = "main"
values_files = ["task.values.yaml"]
load_images = []
helm_timeout = "1200s"
cluster_create_timeout_sec = 600
ready_timeout_sec = 600

[[environment.mcp_servers]]
name = "observability"
transport = "streamable-http"
url = "http://obs-mcp:8000/mcp"

[environment.healthcheck]
command = "(/usr/local/bin/check_episode_ready && curl -fsS -X POST -H 'Content-Type: application/json' -d '{\"query\":\"{ shop { name } }\"}' http://svc-saleor-api:8000/graphql/ | grep -q '\"name\"' || exit 1) && curl -fsS -X POST -H \"X-SRE-World-Grader-Access: $(cat /run/verifier/grader-access/token)\" http://loadgen:9100/grader/episode-start >/dev/null"
interval_sec = 3.0
timeout_sec = 10.0
start_period_sec = 10.0
retries = 197

[agent]
user = "agent"
timeout_sec = 3903.0

[verifier]
environment_mode = "shared"
user = "root"
timeout_sec = 4743.0

[verifier.env]
LOADGEN_GRADER_URL = "http://loadgen:9100"
GRADER_ACCESS_TOKEN_FILE = "/run/verifier/grader-access/token"

[solution.env]
