    text: make sure the problem stays gone after one restart and a sustained recovery period.
  - id: 13-O-2
    text: make the narrowest durable repair you can
  - id: 13-SR-1
    text: what is actually causing it
  - id: 13-SR-2
    text: make sure the problem stays gone after one restart and a sustained recovery period.
  - id: 13-SR-3
    text: make sure the problem stays gone after one restart and a sustained recovery period.
  - id: 13-SR-4
    text: make the narrowest durable repair you can
  - id: 13-SR-5
    text: keep message history and safety controls intact
  - id: 13-SR-6
    text: keep capacity and unrelated services intact
