        observe: {artifact: derived/repair-scope.json, pointer: /phases/declaration/yaml:sut~1config~1app.yaml.roles.message.db.pool_size}
        assert: {op: lte, value: 20}
      - id: message_overflow_ceiling_at_declaration
        requirement_ids: [13-SR-6]
        summary: Message overflow capacity remains within the existing budget at declaration.
        observe: {artifact: derived/repair-scope.json, pointer: /phases/declaration/yaml:sut~1config~1app.yaml.roles.message.db.max_overflow}
        assert: {op: lte, value: 10}
      - id: message_timeout_floor_at_declaration
