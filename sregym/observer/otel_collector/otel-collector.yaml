---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observe
data:
  config.yaml: |
    receivers:
      jaeger:
        protocols:
          thrift_compact:
            endpoint: "0.0.0.0:6831"
          thrift_http:
            endpoint: "0.0.0.0:14268"
          grpc:
            endpoint: "0.0.0.0:14250"
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"

    processors:
      resource/jaeger:
        attributes:
          # Jaeger UDP has no connection context; its process tag identifies the pod.
          - key: k8s.pod.ip
            from_attribute: ip
            action: insert
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata: [k8s.namespace.name]
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection

    connectors:
      spanmetrics:
        namespace: traces_span_metrics
        # Replica-specific resource attributes must not split one metric counter.
        resource_metrics_key_attributes: [service.name, k8s.namespace.name]
        histogram:
          unit: ms
          explicit:
            # Bare numbers are parsed as nanoseconds, not the histogram's output unit.
            buckets: [1ms, 2.5ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
        dimensions:
          - name: k8s.namespace.name
      spanmetrics/otlp:
        namespace: traces_span_metrics
        resource_metrics_key_attributes: [service.name, k8s.namespace.name]
        histogram:
          unit: ms
          explicit:
            buckets: [5ms, 10ms, 25ms, 50ms, 75ms, 100ms, 250ms, 500ms, 750ms, 1s, 1.5s, 2s, 5s]
        dimensions:
          - name: k8s.namespace.name

    exporters:
      otlp:
        endpoint: "jaeger-backend:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
      prometheus/otlp:
        endpoint: "0.0.0.0:8890"

    service:
      pipelines:
        traces:
          receivers: [jaeger]
          processors: [resource/jaeger, k8sattributes]
          exporters: [otlp, spanmetrics]
        traces/otlp:
          receivers: [otlp]
          processors: [k8sattributes]
          exporters: [otlp, spanmetrics/otlp]
        metrics/spanmetrics:
          receivers: [spanmetrics]
          exporters: [prometheus]
        metrics/spanmetrics-otlp:
          receivers: [spanmetrics/otlp]
          exporters: [prometheus/otlp]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: observe
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sregym-otel-collector
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sregym-otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sregym-otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: observe
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app-name: otel-collector
  namespace: observe
spec:
  ports:
    - port: 6831
      name: jaeger-compact
      protocol: UDP
    - port: 14268
      name: jaeger-thrift-http
      protocol: TCP
    - port: 14250
      name: jaeger-grpc
      protocol: TCP
    - port: 4317
      name: otlp-grpc
      protocol: TCP
    - port: 8889
      name: prometheus
      protocol: TCP
    - port: 8890
      name: prometheus-otlp
      protocol: TCP
  selector:
    app-name: otel-collector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app-name: otel-collector
  namespace: observe
spec:
  replicas: 1
  selector:
    matchLabels:
      app-name: otel-collector
  template:
    metadata:
      labels:
        app-name: otel-collector
      name: otel-collector
    spec:
      serviceAccountName: otel-collector
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.104.0
          args:
            - "--config=/etc/otel/config.yaml"
          ports:
            - containerPort: 6831
              protocol: UDP
            - containerPort: 14268
              protocol: TCP
            - containerPort: 14250
              protocol: TCP
            - containerPort: 4317
              protocol: TCP
            - containerPort: 8889
              protocol: TCP
            - containerPort: 8890
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/otel
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
      restartPolicy: Always
