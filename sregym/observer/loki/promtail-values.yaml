# Promtail Helm chart values for SREGym
config:
  clients:
    - url: http://loki-gateway/loki/api/v1/push
  snippets:
    pipelineStages:
      # The chart's default parsing.
      - cri: {}
      # Controllers and the CNI log noise-controller objects as namespace/name.
      - drop:
          expression: "(^|[^a-z0-9-])(chaos-mesh|khaos)/"
    extraRelabelConfigs:
      # Keep noise-controller logs out of Loki, including direct API queries.
      - action: drop
        source_labels: [__meta_kubernetes_namespace]
        regex: chaos-mesh|khaos
