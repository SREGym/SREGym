# Promtail Helm chart values for SREGym
config:
  clients:
    - url: http://loki-gateway/loki/api/v1/push
  snippets:
    extraRelabelConfigs:
      # Keep noise-controller logs out of Loki, including direct API queries.
      - action: drop
        source_labels: [__meta_kubernetes_namespace]
        regex: chaos-mesh|khaos|sregym|sregym-verifier
