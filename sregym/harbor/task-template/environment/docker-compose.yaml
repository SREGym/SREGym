# Generated by sregym.harbor.adapter; names must match sregym/harbor/protocol.py.
# Harbor configures the main service's build, command, log mounts and resource
# limits itself.
services:
  main:
    # Start order only: readiness is task.toml's [environment.healthcheck], so
    # Compose does not block for the length of cluster setup.
    depends_on:
      - sregym
    volumes:
      - sregym-shared:{{agent_shared_dir}}:ro

  sregym:
    # Privileged Docker-in-Docker SREGym runtime (docker/dind). Its entrypoint
    # starts a private Docker daemon and KIND cluster, then runs the command.
    image: ${SREGYM_HARBOR_IMAGE:-{{backend_image}}}
    privileged: true
    cgroup: private
    command: ["python", "-m", "sregym.harbor.backend"]
    environment:
      SREGYM_PROBLEM_ID: "{{problem_id}}"
      SREGYM_ORACLE_TOKEN_SHA256: "{{oracle_token_sha256}}"
      # Docker Hub pull-through mirror for the private daemon and every KIND
      # node; pulls fall back to Docker Hub. Set the variable empty to disable.
      SREGYM_REGISTRY_MIRROR: "${SREGYM_REGISTRY_MIRROR-{{registry_mirror}}}"
      # Prebuilt KIND node image; empty builds kind/Dockerfile during setup.
      SREGYM_KIND_NODE_IMAGE: "${SREGYM_KIND_NODE_IMAGE-{{kind_node_image}}}"
      # Setup diagnostics (host report, dockerd and KIND logs) go to the
      # collected log directory. A failed setup marks the shared state failed,
      # so the healthcheck stops at once, and stays up so Harbor can collect them.
      SREGYM_DIND_RESULTS: "{{log_dir}}/dind"
      SREGYM_FAILURE_STATE_DIR: "{{backend_shared_dir}}"
      SREGYM_HOLD_ON_FAILURE_S: "3600"
    volumes:
      - sregym-shared:{{backend_shared_dir}}
    stop_grace_period: 60s

volumes:
  sregym-shared: {}
