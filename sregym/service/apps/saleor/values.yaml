# SREGym deployment overlay for the Incident Arena saleor chart.
#
# Deploys the healthy Saleor stack with the images pinned by the Incident Arena
# task, drops the Harbor harness (agent foothold, egress proxy, DNS filter,
# in-chart Prometheus/Loki/obs-mcp) in favour of SREGym's own observability
# stack, and replaces the foothold with an operator toolbox. Problems layer
# their load profile and fault values on top.
global:
  imagePullPolicy: IfNotPresent

saleor:
  # Django's URL validator needs a dotted host, so this pins the namespace.
  publicUrl: "http://svc-saleor-api.saleor.svc.cluster.local:8000/"
  allowedHosts: "svc-saleor-api,svc-saleor-api.saleor.svc.cluster.local,localhost,127.0.0.1"
  # One four-CPU API pod saturates under the healthy checkout workload.
  api:
    replicaCount: 2
    workers: 4
    resources:
      limits:
        cpu: "4"

main:
  enabled: false

obs:
  enabled: false

loadgen:
  enabled: true

gradingHarness:
  # The load generator requires an answer key at startup; under sregym.enabled
  # the chart renders a fault-free one (see sregym.neutralAnswerKey).
  answerKey:
    enabled: true

sregym:
  enabled: true
  loadgenLabels:
    app: load-generator
  loadgenEnv:
    # SREGym pins the episode start itself, possibly long after the sidecar
    # boots (Incident Arena's 1800 s limit assumed Harbor's healthcheck).
    - name: EPISODE_START_TIMEOUT_S
      value: "86400"
  toolbox:
    enabled: true
