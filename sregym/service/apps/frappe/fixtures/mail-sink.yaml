# SMTP sink for frappe_writes_and_queue_oom. Incident Arena
# delivered the seeded Frappe mail to an in-cluster mailbox inside its private
# grading plane; SREGym runs Mailpit instead and counts deliveries through its
# API. Labelled like SREGym's load generators so it stays out of the agent's view.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-sink
  labels:
    app: load-generator
    app.kubernetes.io/component: mail-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mail-sink
  template:
    metadata:
      labels:
        app: load-generator
        app.kubernetes.io/component: mail-sink
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.21.8
          imagePullPolicy: IfNotPresent
          ports:
            - {name: smtp, containerPort: 1025}
            - {name: http, containerPort: 8025}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: "10m", memory: "32Mi"}
            limits: {cpu: "200m", memory: "128Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: mail-sink
  labels:
    app: load-generator
    app.kubernetes.io/component: mail-sink
spec:
  selector:
    app.kubernetes.io/component: mail-sink
  ports:
    - {name: smtp, port: 1025, targetPort: smtp}
    - {name: http, port: 8025, targetPort: http}
