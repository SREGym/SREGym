# SREGym deployment overlay for the Incident Arena frappe chart.
#
# Deploys the healthy Frappe site with the images pinned by the Incident Arena
# tasks and the workload shape every Frappe task shares (supervised long
# workers and scheduler, no socketio), drops the Harbor harness (agent foothold,
# egress proxy, DNS filter, in-chart Prometheus/Loki/obs-mcp) in favour of
# SREGym's own observability stack, and replaces the foothold with an operator
# toolbox. Problems layer their load profile and fault values on top.
global:
  imagePullPolicy: IfNotPresent

main:
  enabled: false

loadgen:
  enabled: true
  profile: frappe_jobs_agent

gradingHarness:
  # The load generator requires an answer key at startup; under sregym.enabled
  # the chart renders a fault-free one (see sregym.neutralAnswerKey).
  answerKey:
    enabled: true
  # The load generator pins pod restart counts before it starts; without this
  # namespaced get/list-pods grant it waits 300s and never starts its schedule.
  podState:
    enabled: true

erpnext:
  redis-queue:
    master:
      # Healthy queue broker: finite, loss-intolerant capacity.
      extraFlags:
        - --maxmemory
        - 64mb
        - --maxmemory-policy
        - noeviction
      persistence:
        enabled: true
  worker:
    default:
      replicaCount: 0
    short:
      replicaCount: 0
    long:
      # Enough capacity for the healthy report workload and broker restart.
      # The scope guard captures this initial count before fault injection.
      replicaCount: 4
      supervise: true
      resources:
        requests:
          cpu: 250m
        limits:
          cpu: 1000m
    scheduler:
      replicaCount: 1
  socketio:
    replicaCount: 0

sregym:
  enabled: true
  loadgenLabels:
    app: load-generator
  loadgenEnv:
    # SREGym pins the episode start itself, possibly long after the sidecar
    # boots (Incident Arena's 1800 s limit assumed Harbor's healthcheck).
    - name: EPISODE_START_TIMEOUT_S
      value: "86400"
  neutralAnswerKey:
    scenario: sregym-healthy-baseline
    # The load generator waits for these workloads before it starts. Its
    # default list includes workers SREGym (like every Frappe task) does not
    # deploy, so name only the deployed web tier, as the tasks' answer keys do.
    docker_state:
      services: [svc-frappe-web]
  toolbox:
    enabled: true
