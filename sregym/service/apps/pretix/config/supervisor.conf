[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
minfds=1024
[program:nginx]
command=/usr/sbin/nginx -c /etc/pretix/nginx.conf
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
[program:pretixweb]
command=/usr/local/bin/gunicorn pretix.wsgi --name pretix --workers 12 --worker-class gthread --threads 16 --keep-alive 75 --log-level info --bind unix:/tmp/pretix.sock
directory=/pretix/src
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
