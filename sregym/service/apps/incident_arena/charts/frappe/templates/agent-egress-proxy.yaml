{{- if .Values.main.enabled }}
{{- $allowedHosts := .Values.agentEgressProxy.allowedHosts }}
{{- $runtimeAllowedHosts := list }}
{{- range splitList ";" (.Values.agentEgressProxy.runtimeAllowedHosts | default "") }}
{{- $host := trim . }}
{{- if $host }}{{- $runtimeAllowedHosts = append $runtimeAllowedHosts $host }}{{- end }}
{{- end }}
{{- if gt (len $runtimeAllowedHosts) 0 }}{{- $allowedHosts = uniq $runtimeAllowedHosts }}{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-egress-proxy-config
  labels:
    {{- include "frappe-spine.labels" $ | nindent 4 }}
    app.kubernetes.io/component: agent-egress-proxy
data:
  bootstrap-envoy.yaml: |-
    {{- include "frappe-spine.agentEgressProxyConfig" (dict "root" $ "public" true) | nindent 4 }}
  runtime-envoy.yaml: |-
    {{- include "frappe-spine.agentEgressProxyConfig" (dict "root" $ "hosts" $allowedHosts) | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-egress-proxy
  labels:
    {{- include "frappe-spine.labels" $ | nindent 4 }}
    app.kubernetes.io/component: agent-egress-proxy
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-egress-proxy
  labels:
    {{- include "frappe-spine.labels" $ | nindent 4 }}
    app.kubernetes.io/component: agent-egress-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: agent-egress-proxy
  template:
    metadata:
      labels:
        {{- include "frappe-spine.labels" $ | nindent 8 }}
        app.kubernetes.io/component: agent-egress-proxy
      annotations:
        checksum/config: {{ printf "stock-egress-v4:%v:%v:%s:public-bootstrap" .Values.agentEgressProxy.port .Values.agentEgressProxy.tlsGatewayPort (toJson $allowedHosts) | sha256sum }}
        sre-world/egress-phase: runtime
    spec:
      serviceAccountName: agent-egress-proxy
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: proxy
          image: {{ .Values.images.egressEnvoy | quote }}
          # This chart-only guard image is not part of the custom substrate
          # release or local side-load set. Always resolve its immutable digest.
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/agent-egress/runtime-envoy.yaml", "--service-cluster", "agent-egress-proxy"]
          ports:
            - {name: proxy, containerPort: {{ .Values.agentEgressProxy.port }}}
          readinessProbe:
            tcpSocket: {port: proxy}
            initialDelaySeconds: 1
            periodSeconds: 3
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: "20m", memory: "48Mi"}
            limits: {cpu: "200m", memory: "128Mi"}
          volumeMounts:
            - {name: config, mountPath: /etc/agent-egress, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: agent-egress-proxy-config}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-egress-proxy
  labels:
    {{- include "frappe-spine.labels" $ | nindent 4 }}
    app.kubernetes.io/component: agent-egress-proxy
spec:
  selector: {app.kubernetes.io/component: agent-egress-proxy}
  ports:
    - {name: proxy, port: {{ .Values.agentEgressProxy.port }}, targetPort: proxy}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-egress-proxy
  labels:
    {{- include "frappe-spine.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: agent-egress-proxy}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: main}
      ports:
        - {protocol: TCP, port: {{ .Values.agentEgressProxy.port }}}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: agent-egress-tls-gateway}
      ports:
        - {protocol: TCP, port: {{ .Values.agentEgressProxy.tlsGatewayPort }}}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4]
      ports:
        - {protocol: TCP, port: 80}
        - {protocol: TCP, port: 443}
{{- end }}
