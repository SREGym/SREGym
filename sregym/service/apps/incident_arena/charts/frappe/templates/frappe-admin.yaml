{{- if include "frappe-spine.enabled" (dict "root" $ "key" "frappeAdmin") }}
# ── frappe-admin: the fix-application primitive (D16 Phase 3 stub) ─────────
#
# Phase 4 will inject the frappe-admin container into every Frappe workload
# pod (sidecar shape) so /admin/reload can SIGKILL PID 1 for that workload —
# the load-bearing PostgreSQL-analog reload primitive Frappe doesn't have
# natively. Until then it runs as a standalone Deployment so:
#   * its /metrics endpoint is Prometheus-scrapable (RQ queue depth via raw
#     Redis LLEN — accurate because RQ queues live in the shared Redis, not
#     per-workload)
#   * its liveness gauge appears in metrics.jsonl (parse_metrics tests can
#     assert the exposition shape without a live Frappe deploy)
#
# Queue maintenance is deliberately narrower than Kubernetes administration:
# this service account may patch only the generated queue startup script and
# delete/get only the single standalone queue pod. The agent receives no token;
# the HTTP handler accepts only the three bounded queue repairs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frappe-admin
  labels:
    {{- include "frappe-spine.labels" $ | nindent 4 }}
    app.kubernetes.io/component: frappe-admin
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frappe-admin-queue-maintainer
  labels:
    {{- include "frappe-spine.labels" $ | nindent 4 }}
    app.kubernetes.io/component: frappe-admin
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ printf "%s-redis-queue-scripts" .Release.Name | quote }}]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: [{{ printf "%s-redis-queue-master-0" .Release.Name | quote }}]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frappe-admin-queue-maintainer
  labels:
    {{- include "frappe-spine.labels" $ | nindent 4 }}
    app.kubernetes.io/component: frappe-admin
subjects:
  - kind: ServiceAccount
    name: frappe-admin
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: frappe-admin-queue-maintainer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-admin
  labels:
    {{- include "frappe-spine.labels" $ | nindent 4 }}
    app.kubernetes.io/component: frappe-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: frappe-admin
  template:
    metadata:
      labels:
        {{- include "frappe-spine.labels" $ | nindent 8 }}
        app.kubernetes.io/component: frappe-admin
    spec:
      serviceAccountName: frappe-admin
      automountServiceAccountToken: true
      containers:
        - name: frappe-admin
          image: {{ .Values.images.frappeAdmin | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: FRAPPE_ADMIN_HOST
              value: "0.0.0.0"
            - name: FRAPPE_ADMIN_PORT
              value: "8000"
            - name: REDIS_QUEUE_HOST
              value: "svc-redis-queue"
            - name: REDIS_QUEUE_PORT
              value: "6379"
            - name: REDIS_CACHE_HOST
              value: "svc-redis-cache"
            - name: REDIS_CACHE_PORT
              value: "6379"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: REDIS_QUEUE_SCRIPTS_CONFIGMAP
              value: {{ printf "%s-redis-queue-scripts" .Release.Name | quote }}
            - name: REDIS_QUEUE_POD
              value: {{ printf "%s-redis-queue-master-0" .Release.Name | quote }}
            # Frappe v16 namespaces RQ keys by the absolute bench path:
            # /home/frappe/frappe-bench -> home-frappe-frappe-bench.
            - name: RQ_QUEUE_PREFIX
              value: "home-frappe-frappe-bench"
            # RQ_QUEUES default (short,default,long) matches Frappe's built-in
            # queue set. The sidecar combines each logical name with the prefix
            # above before issuing raw-Redis LLEN.
            - name: RQ_QUEUES
              value: "short,default,long"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {cpu: "20m", memory: "48Mi"}
            limits:   {cpu: "100m", memory: "128Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: frappe-admin
  labels:
    {{- include "frappe-spine.labels" $ | nindent 4 }}
    app.kubernetes.io/component: frappe-admin
spec:
  selector:
    app.kubernetes.io/component: frappe-admin
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- end }}
