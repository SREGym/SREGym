# Default values for erpnext.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Configure external database host
# dbHost: ""
# dbPort: 3306
# dbRootUser: ""
# dbRootPassword: ""
# dbRds: false
# dbExistingSecret: ""
# dbExistingSecretPasswordKey: "password"

# Configure external redis host
externalRedis:
  cache: ""
  queue: ""

image:
  repository: frappe/erpnext
  tag: v16.26.2
  pullPolicy: IfNotPresent

nginx:
  podAnnotations: {}
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPU: 75
    targetMemory: 75
  # config: |
  #   # custom conf /etc/nginx/conf.d/default.conf
  environment:
    upstreamRealIPAddress: "127.0.0.1"
    upstreamRealIPRecursive: "off"
    upstreamRealIPHeader: "X-Forwarded-For"
    frappeSiteNameHeader: "$host"
    proxyReadTimeout: "120"
    clientMaxBodySize: "50m"
  livenessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  service:
    type: ClusterIP
    port: 8080
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Custom topologySpreadConstraints (uncomment and modify to override defaults)
  # topologySpreadConstraints:
  #   - maxSkew: 2
  #     topologyKey: failure-domain.beta.kubernetes.io/zone
  #     whenUnsatisfiable: ScheduleAnyway

  # Default topologySpreadConstraints (used if topologySpreadConstraints is not set)
  defaultTopologySpread:
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  envVars: []
  initContainers: []
  sidecars: []

worker:
  gunicorn:
    podAnnotations: {}
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 75
      targetMemory: 75
    livenessProbe:
      tcpSocket:
        port: 8000
      initialDelaySeconds: 5
      periodSeconds: 10
    readinessProbe:
      # Prove gunicorn serves the created site; a bound TCP port is too early.
      # This must live in the subchart default because Helm would deep-merge a
      # parent httpGet with this handler instead of deleting tcpSocket.
      httpGet:
        path: /api/method/ping
        port: 8000
        httpHeaders:
          - { name: Host, value: svc-frappe-web }
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30
    service:
      type: ClusterIP
      port: 8000
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    args: []
    envVars: []
    initContainers: []
    sidecars: []

  default:
    podAnnotations: {}
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 75
      targetMemory: 75
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    livenessProbe:
      override: false
      probe: {}
    readinessProbe:
      override: false
      probe: {}
    envVars: []
    initContainers: []
    sidecars: []

  short:
    podAnnotations: {}
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 75
      targetMemory: 75
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    livenessProbe:
      override: false
      probe: {}
    readinessProbe:
      override: false
      probe: {}
    envVars: []
    initContainers: []
    sidecars: []

  long:
    podAnnotations: {}
    replicaCount: 1
    # Keep false for ordinary tasks so an unexpected worker exit remains a
    # visible pod failure. Queue-fault tasks opt in so Helm can finish while
    # Redis rejects worker registration and the worker can start after repair.
    supervise: false
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 75
      targetMemory: 75
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    livenessProbe:
      override: false
      probe: {}
    readinessProbe:
      override: false
      probe: {}
    envVars: []
    initContainers: []
    sidecars: []

  scheduler:
    podAnnotations: {}
    replicaCount: 1
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    livenessProbe:
      override: false
      probe: {}
    readinessProbe:
      override: false
      probe: {}
    envVars: []
    initContainers: []
    sidecars: []


  # Custom topologySpreadConstraints (uncomment and modify to override defaults)
  # topologySpreadConstraints:
  #   - maxSkew: 2
  #     topologyKey: failure-domain.beta.kubernetes.io/zone
  #     whenUnsatisfiable: ScheduleAnyway

  # Default topologySpreadConstraints (used if topologySpreadConstraints is not set)
  defaultTopologySpread:
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule


  healthProbe: |
    exec:
      command:
        - bash
        - -c
        - |-
          echo "Pinging backing services";
          {{- if (index .Values "mariadb-sts").enabled }}
          wait-for-it {{ include "erpnext.fullname" . }}-mariadb-sts:3306 -t 1;
          {{- else if (index .Values "postgresql-sts").enabled }}
          wait-for-it {{ include "erpnext.fullname" . }}-postgresql-sts:5432 -t 1;
          {{- else if or .Values.mariadb.enabled (get .Values "mariadb-subchart").enabled }}
          (
            wait-for-it {{ .Release.Name }}-mariadb-subchart:3306 -t 0 || \
            wait-for-it {{ .Release.Name }}-mariadb:3306 -t 0 || \
            wait-for-it {{ .Release.Name }}-mariadb-subchart-primary:3306 -t 0 || \
            wait-for-it {{ .Release.Name }}-mariadb-primary:3306 -t 1
          )
          {{- else if or .Values.postgresql.enabled (get .Values "postgresql-subchart").enabled }}
          (
            wait-for-it {{ .Release.Name }}-postgresql-subchart:5432 -t 0 || \
            wait-for-it {{ .Release.Name }}-postgresql:5432 -t 1
          )
          {{- else if or .Values.postgresql.enabled (index .Values "postgresql-subchart").enabled }}
          wait-for-it {{ .Release.Name }}-postgresql-subchart:5432 -t 1;
          {{- else if .Values.dbHost }}
          wait-for-it {{ .Values.dbHost }}:{{ .Values.dbPort }} -t 1;
          {{- end }}
          {{- if .Values.externalRedis.cache }}
          wait-for-it $(echo {{ .Values.externalRedis.cache }} | sed 's,redis://,,') -t 1;
          {{- else if (index .Values "valkey-cache").enabled }}
          wait-for-it {{ .Release.Name }}-valkey-cache:6379 -t 1;
          {{- else if (index .Values "dragonfly-cache").enabled }}
          wait-for-it {{ .Release.Name }}-dragonfly-cache:6379 -t 1;
          {{- else if (index .Values "redis-cache").enabled }}
          wait-for-it {{ .Release.Name }}-redis-cache-master:6379 -t 1;
          {{- end }}
          {{- if .Values.externalRedis.queue }}
          wait-for-it $(echo {{ .Values.externalRedis.queue }} | sed 's,redis://,,') -t 1;
          {{- else if (index .Values "valkey-queue").enabled }}
          wait-for-it {{ .Release.Name }}-valkey-queue:6379 -t 1;
          {{- else if (index .Values "dragonfly-queue").enabled }}
          wait-for-it {{ .Release.Name }}-dragonfly-queue:6379 -t 1;
          {{- else if (index .Values "redis-queue").enabled }}
          wait-for-it {{ .Release.Name }}-redis-queue-master:6379 -t 1;
          {{- end }}
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 5

socketio:
  podAnnotations: {}
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPU: 75
    targetMemory: 75
  livenessProbe:
    tcpSocket:
      port: 9000
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    tcpSocket:
      port: 9000
    initialDelaySeconds: 5
    periodSeconds: 10
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    type: ClusterIP
    port: 9000
  envVars: []
  initContainers: []
  sidecars: []

persistence:
  worker:
    enabled: true
    # existingClaim: ""
    size: 8Gi
    # storageClass: "nfs"
    accessModes:
    - ReadWriteMany
  logs:
    # Container based log search and analytics stack recommended
    enabled: false
    # existingClaim: ""
    size: 8Gi
    # storageClass: "nfs"
    accessModes:
    - ReadWriteMany

# Ingress
ingress:
  # ingressName: ""
  # className: ""
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
  - host: erp.cluster.local
    paths:
    - path: /
      pathType: ImplementationSpecific
  tls: []
  #  - secretName: auth-server-tls
  #    hosts:
  #      - auth-server.local

httproute:
  enabled: false
  name: ""
  annotations: {}
  parentRefs:
  - gatewayName: "public-gateway"
    gatewayNamespace: "networking"
      # gatewayKind: "Gateway"
    gatewaySectionName: "http"
  hostnames:
  - "erp.example.com"
  rules:
  - matches:
    - pathType: "PathPrefix"
      path: "/"

jobs:
  volumePermissions:
    # jobName: ""
    enabled: false
    backoffLimit: 0
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  configure:
    # jobName: ""
    enabled: true
    fixVolume: true
    backoffLimit: 0
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    envVars: []
    command: []
    args: []
  # ------------------------------------------------------------------------------
  # Site creation jobs
  #
  # IMPORTANT:
  # - Only ONE site-creation job should be enabled at a time.
  # - If BOTH `createSite.enabled` and `createMultipleSite.enabled` are set to true,
  #   then `createSite` will take precedence and `createMultipleSite` will be ignored.
  #
  # Backward compatibility:
  # - `createSite` is enabled by default to preserve existing behavior.
  # ------------------------------------------------------------------------------

  createSite:
    # jobName: ""
    enabled: false
    forceCreate: false
    siteName: "erp.cluster.local"
    adminPassword: "changeit"
    adminExistingSecret: ""
    adminExistingSecretKey: "password"
    installApps:
    - "erpnext"
    dbType: "mariadb"
    backoffLimit: 0
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  createMultipleSites:
    # jobName: ""
    enabled: false
    forceCreate: false
    sites:
    - name: "erp.cluster.local"
      installApps:
      - "erpnext"
      # - name: "accounts.cluster.local"
      #   installApps:
      #     - "erpnext"
      #     - "payments"
    adminPassword: "changeit"
    adminExistingSecret: ""
    adminExistingSecretKey: "password"
    dbType: "mariadb"
    backoffLimit: 0
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  # ------------------------------------------------------------------------------
  # Site deletion jobs
  #
  # IMPORTANT:
  # - Only ONE site-deletion job should be enabled at a time.
  # - If BOTH `dropSite.enabled` and `dropMultipleSites.enabled` are set to true,
  #   then `dropSite` will take precedence and `dropMultipleSites` will be ignored.
  #
  # Backward compatibility:
  # - `dropSite` remains the default behavior.
  # - `dropMultipleSites` is an additive, non-breaking feature.
  # ------------------------------------------------------------------------------

  dropSite:
    # jobName: ""
    enabled: false
    forced: false
    siteName: "erp.cluster.local"
    backoffLimit: 0
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  dropMultipleSites:
    # jobName: ""
    enabled: false

    # Force deletion of sites without confirmation
    forced: false

    # List of sites to be dropped
    sites:
    - name: "site1.example.com"
    - name: "site2.example.com"

    backoffLimit: 0
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  # ------------------------------------------------------------------------------
  # Backup jobs
  #
  # IMPORTANT:
  # - Only ONE backup job should be enabled at a time.
  # - If BOTH `backup.enabled` and `backupMultipleSites.enabled` are true,
  #   then `backup` takes precedence and `backupMultipleSites` is ignored.
  #
  # Backward compatibility:
  # - `backup` remains the default behavior for existing users.
  # - `backupMultipleSites` is an additive, non-breaking feature.
  #
  # This applies to both `backup` and `backupMultipleSites`.
  # ------------------------------------------------------------------------------

  backup:
    # jobName: ""
    enabled: false
    siteName: "erp.cluster.local"
    withFiles: true
    backoffLimit: 0
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  backupMultipleSites:
    # jobName: ""
    enabled: false

    # Include files directory in the backup
    withFiles: true

    # List of sites to back up
    sites:
    - name: "erp.cluster.local"
      # - name: "accounts.cluster.local"

    backoffLimit: 0
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  # ------------------------------------------------------------------------------
  # Migrate jobs
  #
  # IMPORTANT:
  # - Only ONE migrate job should be enabled at a time.
  # - If BOTH `migrate.enabled` and `migrateMultipleSites.enabled` are true,
  #   then `migrate` takes precedence and `migrateMultipleSites` is ignored.
  #
  # Backward compatibility:
  # - `migrate` remains unchanged for existing users.
  # - `migrateMultipleSites` is additive, non-breaking feature.
  #
  # This applies to both `migrate` and `migrateMultipleSites`,
  # ------------------------------------------------------------------------------

  migrate:
    # jobName: ""
    enabled: false
    siteName: "erp.cluster.local"
    skipFailing: false
    backoffLimit: 0
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  migrateMultipleSites:
    # jobName: ""
    enabled: false

    # Skip failing patches during migration
    skipFailing: false

    # List of sites to migrate (processed sequentially)
    sites:
    - name: "erp.cluster.local"
      # - name: "accounts.cluster.local"

    backoffLimit: 0
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  clearCache:
    enabled: false
    # jobName: ""
    # If empty, falls back to erpnext.serviceAccountName helper
    serviceAccountName: ""
    initContainer:
      enabled: false
      image: alpine/kubectl:1.35.0
      deployment:
        # If empty → <fullname>-gunicorn
        name: ""
      # Rollout wait timeout
      timeout: 600s
    redisFlush:
      enabled: false
    backoffLimit: 0
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  custom:
    enabled: false
    jobName: ""
    labels: {}
    backoffLimit: 0
    initContainers: []
    containers: []
    restartPolicy: Never
    volumes: []
    nodeSelector: {}
    affinity: {}
    tolerations: []

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true

podSecurityContext:
  supplementalGroups: [1000]

securityContext:
  capabilities:
    add:
    - CAP_CHOWN
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

mariadb-sts:
  enabled: false
  image:
    repository: mariadb
    tag: "10.6"
    pullPolicy: IfNotPresent
  rootPassword: "changeit"
  persistence:
    # storageClass: "nfs"
    size: 8Gi
  resources: {}
  myCnf: |
    [mysqld]
    skip-character-set-client-handshake
    skip-innodb-read-only-compressed
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci


mariadb-subchart:
  # To enable the classic Bitnami MariaDB subchart, set enabled to true
  # and set mariadb-sts.enabled to false.
  enabled: false
  image:
    repository: bitnamilegacy/mariadb
    tag: "10.6.17-debian-11-r10"
  # Values passed to the bitnami/mariadb subchart can be defined here.

# alias for mariadb-subchart.enabled for backward compatibility
mariadb:
  enabled: false

dragonfly-cache:
  # Using DragonflyDB: https://www.dragonflydb.io/
  # https://github.com/dragonflydb/dragonfly/tree/main/helm/dragonfly
  # To enable DragonflyDB for cache, set enabled to true
  # and set valkey-cache.enabled to false.
  enabled: false
  # host: ""
  # No persistence for cache

dragonfly-queue:
  # Using DragonflyDB: https://www.dragonflydb.io/
  # https://github.com/dragonflydb/dragonfly/tree/main/helm/dragonfly
  # To enable DragonflyDB for queue, set enabled to true
  # and set valkey-queue.enabled to false.
  enabled: false
  # host: ""
  # Persistence can be enabled for queue
  storage:
    enabled: false
    # The size of the PersistentVolumeClaim.
    size: 8Gi
    # The name of the StorageClass to use. If not specified, the default StorageClass will be used.
    # storageClassName: "nfs"

postgresql:
  enabled: false # alias for postgresql-subchart.enabled

postgresql-subchart:
  # To enable the classic Bitnami PostgreSQL subchart, set enabled to true
  # and set postgresql.enabled to false.
  enabled: false
  image:
    repository: bitnamilegacy/postgresql
    tag: "14"
  # Values passed to the bitnami/postgresql subchart can be defined here.

postgresql-sts:
  enabled: false
  image:
    repository: postgres
    tag: "15"
    pullPolicy: IfNotPresent
  postgresUser: "postgres"
  postgresPassword: "changeit"
  persistence:
    # storageClass: "nfs"
    size: 8Gi
  resources: {}

redis-cache:
  # To enable the classic Bitnami Redis subchart for cache, set enabled to true
  # and set dragonfly-cache.enabled to false.
  enabled: false
  image:
    repository: bitnamilegacy/redis
    tag: "7.0"
  # Values passed to the bitnami/redis subchart can be defined here.

redis-queue:
  # To enable the classic Bitnami Redis subchart for queue, set enabled to true
  # and set dragonfly-queue.enabled to false.
  enabled: false
  image:
    repository: bitnamilegacy/redis
    tag: "7.0"
  # Values passed to the bitnami/redis subchart can be defined here.

valkey-cache:
  # To enable the official Valkey subchart for cache, set enabled to true
  # and set dragonfly-cache.enabled and redis-cache.enabled to false.
  enabled: true
  image:
    repository: valkey/valkey
    tag: "7.2" # check for latest version
  # Values passed to the valkey/valkey subchart can be defined here.

valkey-queue:
  # To enable the official Valkey subchart for queue, set enabled to true
  # and set dragonfly-queue.enabled and redis-queue.enabled to false.
  enabled: true
  image:
    repository: valkey/valkey
    tag: "7.2" # check for latest version
  # Values passed to the valkey/valkey subchart can be defined here.
