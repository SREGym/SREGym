{{- if .Values.runtimeConfigBroker.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: sequencer-config-broker-code
data:
  broker.py: |
{{ .Files.Get "files/sequencer_config_broker.py" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sequencer-config-helper
data:
  set-sequencer-mode: |
    #!/bin/sh
    set -eu
    [ "$#" -eq 1 ] || { echo "usage: set-sequencer-mode atomic" >&2; exit 2; }
    [ "$1" = atomic ] || { echo "mode must be atomic" >&2; exit 2; }
    : "${SEQUENCER_CONFIG_BROKER_URL:?SEQUENCER_CONFIG_BROKER_URL is missing}"
    exec curl --noproxy sequencer-config-broker -fsS -X POST -H 'Content-Type: application/json' \
      --data "{\"mode\":\"$1\"}" \
      "${SEQUENCER_CONFIG_BROKER_URL%/}/v1/sequencer-mode"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sequencer-config-broker
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sequencer-config-broker
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["svc-message"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["svc-message-0"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sequencer-config-broker
subjects:
  - kind: ServiceAccount
    name: sequencer-config-broker
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sequencer-config-broker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sequencer-config-broker
  labels:
    app.kubernetes.io/component: sequencer-config-broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: sequencer-config-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/component: sequencer-config-broker
    spec:
      serviceAccountName: sequencer-config-broker
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: broker
          image: {{ .Values.images.loadgen | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["python3", "/opt/sequencer-config/broker.py"]
          env:
            - name: SEQUENCER_CONFIG_PORT
              value: {{ .Values.runtimeConfigBroker.port | quote }}
            - name: SEQUENCER_CONFIG_TIMEOUT_S
              value: {{ .Values.runtimeConfigBroker.timeoutSeconds | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.runtimeConfigBroker.port }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - name: code
              mountPath: /opt/sequencer-config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: code
          configMap:
            name: sequencer-config-broker-code
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sequencer-config-broker
spec:
  selector:
    app.kubernetes.io/component: sequencer-config-broker
  ports:
    - name: http
      port: {{ .Values.runtimeConfigBroker.port }}
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sequencer-config-broker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: sequencer-config-broker
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: main
      ports:
        - protocol: TCP
          port: {{ .Values.runtimeConfigBroker.port }}
{{- end }}
