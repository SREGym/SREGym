{{- if or .Values.agentSurface.exec.enabled .Values.agentSurface.buildCapable.enabled }}
# Fixed-target Kubernetes API transport for the tightly scoped main ServiceAccount.
# Main cannot route directly to the API.  This pod owns no token, accepts traffic
# only from main, and its immutable Envoy configuration can dial only the in-
# cluster Kubernetes Service.  TLS remains end-to-end; the kubeconfig validates
# the apiserver certificate as kubernetes.default.svc.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-kube-api-proxy-config
  labels:
    {{- include "slack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: agent-kube-api-proxy
data:
  envoy.yaml: |-
    static_resources:
      listeners:
        - name: kube_api
          address:
            socket_address: {address: 0.0.0.0, port_value: 8443}
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: kube_api
                    cluster: kube_api
      clusters:
        - name: kube_api
          connect_timeout: 5s
          type: STRICT_DNS
          dns_lookup_family: V4_ONLY
          load_assignment:
            cluster_name: kube_api
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: kubernetes.default.svc
                          port_value: 443
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-kube-api-proxy
  labels:
    {{- include "slack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: agent-kube-api-proxy
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-kube-api-proxy
  labels:
    {{- include "slack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: agent-kube-api-proxy
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: agent-kube-api-proxy}
  template:
    metadata:
      labels:
        {{- include "slack.labels" $ | nindent 8 }}
        app.kubernetes.io/component: agent-kube-api-proxy
      annotations:
        checksum/config: {{ printf "kube-api-proxy-v1:kubernetes.default.svc:443" | sha256sum }}
    spec:
      serviceAccountName: agent-kube-api-proxy
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: proxy
          image: {{ .Values.images.egressEnvoy | quote }}
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/agent-kube-api/envoy.yaml", "--service-cluster", "agent-kube-api-proxy"]
          ports:
            - {name: api, containerPort: 8443}
          readinessProbe:
            tcpSocket: {port: api}
            initialDelaySeconds: 1
            periodSeconds: 3
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: "10m", memory: "32Mi"}
            limits: {cpu: "100m", memory: "96Mi"}
          volumeMounts:
            - {name: config, mountPath: /etc/agent-kube-api, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: agent-kube-api-proxy-config}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-kube-api-proxy
  labels:
    {{- include "slack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: agent-kube-api-proxy
spec:
  selector: {app.kubernetes.io/component: agent-kube-api-proxy}
  ports:
    - {name: api, port: 8443, targetPort: api}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-kube-api-proxy
  labels:
    {{- include "slack.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: agent-kube-api-proxy}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: main}
      ports:
        - {protocol: TCP, port: 8443}
{{- end }}
