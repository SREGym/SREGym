{{- if include "slack.enabled" (dict "root" $ "key" "loadgen") }}
{{- $needPodRead := or .Values.gradingHarness.podState.enabled .Values.agentSurface.buildCapable.enabled }}
{{- $authEnabled := include "slack.enabled" (dict "root" $ "key" "auth") }}
# ── loadgen: seeded open-loop cyclical schedule against svc-message. LONG-LIVED:
#    runs the schedule, (Oddish path) GRADES IN-POD at episode end, writes
#    /grader/episode_done.json, then `sleep infinity` so the gated GET /grader/*
#    surface (and kubectl-cp for the host-side debugging verifier) works against
#    a Running pod (kubectl cp/exec FAILS on a terminated pod).
#    /grader is PRIVATE and mounted ONLY here — never in main. Verifier-v2 tasks
#    use a grader-owned PVC so finalized evidence survives pod replacement;
#    legacy tasks retain the private emptyDir (D9 tamper-resist).
{{- if $needPodRead }}
# Restart-masking basis (in-pod grading): a DEDICATED ServiceAccount with a
# Build-capable attestation needs one exact target-pod read. pod_state additionally
# needs namespaced get/list for restart evidence. The agent cannot use this SA: it
# has no exec on loadgen and /grader never proxies the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loadgen
  labels:
    {{- include "slack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: loadgen
{{- with $.Values.sregym.loadgenLabels }}{{ toYaml . | nindent 4 }}{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loadgen-pod-reader
  labels:
    {{- include "slack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: loadgen
{{- with $.Values.sregym.loadgenLabels }}{{ toYaml . | nindent 4 }}{{- end }}
rules:
  {{- if .Values.agentSurface.buildCapable.enabled }}
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["svc-{{ .Values.agentSurface.buildCapable.targetRole }}-0"]
    verbs: ["get"]
  {{- end }}
  {{- if .Values.gradingHarness.podState.enabled }}
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loadgen-pod-reader
  labels:
    {{- include "slack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: loadgen
{{- with $.Values.sregym.loadgenLabels }}{{ toYaml . | nindent 4 }}{{- end }}
subjects:
  - kind: ServiceAccount
    name: loadgen
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: loadgen-pod-reader
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
{{- if .Values.gradingHarness.answerKey.enabled }}
# The per-task answer key used by evidence collection, stamped by generate_tasks.
# Mounted READ-ONLY at /grader-key in the loadgen pod ONLY — never in main.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadgen-grader-key
  labels:
    {{- include "slack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: loadgen
{{- with $.Values.sregym.loadgenLabels }}{{ toYaml . | nindent 4 }}{{- end }}
data:
{{- if $.Values.sregym.enabled }}
  # SREGym port: the load generator refuses to start without a mapping here,
  # but SREGym grades through its own oracles, so ship a fault-free key.
  ground-truth.yaml: |
{{ toYaml $.Values.sregym.neutralAnswerKey | indent 4 }}
  config_before.json: |
    {}
{{- else }}
  ground-truth.yaml: |
{{ .Files.Get "ground-truth.yaml" | indent 4 }}
  config_before.json: |
{{ .Files.Get "config-before.json" | indent 4 }}
{{- end }}
---
{{- end }}
{{- if .Values.loadgen.profilesYaml }}
# YAML-defined load profiles (loadgen/profile_loader.py). Mounted read-only at
# /etc/loadgen/profiles.yaml in the loadgen pod ONLY; merged over the compiled
# PROFILES at sidecar startup. The sidecar FAILS LOUDLY on a malformed file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadgen-profiles
  labels:
    {{- include "slack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: loadgen
{{- with $.Values.sregym.loadgenLabels }}{{ toYaml . | nindent 4 }}{{- end }}
data:
  profiles.yaml: {{ .Values.loadgen.profilesYaml | quote }}
---
{{- end }}
{{- if .Values.gradingHarness.verifierEvidence.persistent }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: verifier-evidence-entrypoint
  labels:
    {{- include "slack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: loadgen
{{- with $.Values.sregym.loadgenLabels }}{{ toYaml . | nindent 4 }}{{- end }}
data:
  entrypoint.py: |
{{ .Files.Get "files/verifier-evidence-entrypoint.py" | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loadgen-grader-evidence
  labels:
    {{- include "slack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: loadgen
{{- with $.Values.sregym.loadgenLabels }}{{ toYaml . | nindent 4 }}{{- end }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.gradingHarness.verifierEvidence.size | quote }}
---
{{- end }}
{{- if not $.Values.sregym.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: verifier-restart-survivor-code
data:
  __init__.py: ""
  restart_survivor.py: |
{{ .Files.Get "files/verifier-restart-survivor.py" | indent 4 }}
  db_survivor.py: |
{{ .Files.Get "files/verifier-db-survivor.py" | indent 4 }}
  textual.py: |
{{ .Files.Get "files/verifier-textual.py" | indent 4 }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  labels:
    {{- include "slack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: loadgen
{{- with $.Values.sregym.loadgenLabels }}{{ toYaml . | nindent 4 }}{{- end }}
spec:
  replicas: 1
  {{- if .Values.gradingHarness.verifierEvidence.persistent }}
  # Never overlap episode owners against one ReadWriteOnce evidence volume.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: loadgen
  template:
    metadata:
      labels:
        {{- include "slack.labels" $ | nindent 8 }}
        app.kubernetes.io/component: loadgen
{{- with $.Values.sregym.loadgenLabels }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      {{- if $needPodRead }}
      # Attestation or pod_state snapshots need the scoped SA token (see Role above).
      serviceAccountName: loadgen
      automountServiceAccountToken: true
      {{- else }}
      # No in-pod grading -> no reason for ANY API credential in this pod (the
      # k8s default would otherwise automount the `default` SA token).
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      # Block until the SUT fault-site is serving, then drive the schedule.
      initContainers:
        {{- if eq .Values.loadgen.profile "auth_key_split_history" }}
        - name: wait-for-auth
          image: {{ .Values.images.loadgen | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - "sh"
            - "-ceu"
            - "until curl -sf {{ .Values.loadgen.authTarget }}/healthz; do echo waiting for svc-auth; sleep 2; done"
        {{- end }}
        {{- if .Values.agentSurface.buildCapable.enabled }}
        - name: wait-for-source-seed
          image: {{ .Values.images.loadgen | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - sh
            - -ceu
            - |
              i=0
              until [ -f /src/.seeded ]; do
                i=$((i + 1))
                [ "$i" -lt 181 ] || { echo "source PVC was not seeded within 180s" >&2; exit 1; }
                sleep 1
              done
          volumeMounts:
            - name: source
              mountPath: /src
              readOnly: true
        {{- end }}
        - name: wait-for-message
          image: {{ .Values.images.loadgen | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - "sh"
            - "-c"
            - "until curl -sf {{ .Values.loadgen.target }}/healthz; do echo waiting for svc-message; sleep 2; done"
        {{- if eq .Values.loadgen.profile "auth_key_split_history" }}
        # Probe both deterministic auth cohorts serially before the private
        # temporal history starts. This prevents cold k3s scheduling from being
        # graded as an authentication failure.
        - name: warm-signed-message-path
          image: {{ .Values.images.loadgen | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - "python"
            - "-c"
            - |
              import asyncio
              from collections import Counter
              import json
              import sys

              import aiohttp

              AUTH = "{{ .Values.loadgen.authTarget }}"
              MESSAGE = "{{ .Values.loadgen.target }}"
              USERS = ("auth-alpha", "auth-beta-0")
              MAX_ATTEMPTS = 60

              async def send(session, attempt, user_id):
                  async with session.post(f"{AUTH}/token", json={"user_id": user_id}) as response:
                      mint_body = await response.text()
                      if response.status != 200:
                          return f"mint:{response.status}:{mint_body[:120]}"
                      try:
                          token = json.loads(mint_body).get("token")
                      except Exception as exc:
                          return f"mint-json:{type(exc).__name__}"
                  if not isinstance(token, str) or not token:
                      return "mint-token:missing"
                  body = {
                      "channel_id": "readiness-auth",
                      "client_msg_id": f"readiness-{attempt}-{user_id}",
                      "text": "loadgen readiness",
                  }
                  async with session.post(
                      f"{MESSAGE}/messages",
                      json=body,
                      headers={"authorization": f"Bearer {token}"},
                  ) as response:
                      message_body = await response.text()
                      if response.status in (200, 201):
                          return "ok"
                      return f"message:{response.status}:{message_body[:120]}"

              async def main():
                  timeout = aiohttp.ClientTimeout(total=10)
                  async with aiohttp.ClientSession(timeout=timeout) as session:
                      for attempt in range(1, MAX_ATTEMPTS + 1):
                          outcomes = []
                          for user_id in USERS:
                              try:
                                  outcomes.append(await send(session, attempt, user_id))
                              except Exception as exc:
                                  outcomes.append(f"exception:{type(exc).__name__}:{str(exc)[:120]}")
                          counts = Counter(outcomes)
                          print(
                              f"signed message readiness attempt {attempt}: {dict(counts)}",
                              flush=True,
                          )
                          if outcomes == ["ok", "ok"]:
                              return
                          await asyncio.sleep(2)
                  raise RuntimeError(
                      f"signed message path never stabilized after {MAX_ATTEMPTS} attempts"
                  )

              async def bounded_main():
                  await asyncio.wait_for(main(), timeout=180)

              try:
                  asyncio.run(bounded_main())
              except Exception as exc:
                  print(
                      f"signed message readiness failed: {type(exc).__name__}: {exc}",
                      file=sys.stderr,
                  )
                  raise
        {{- end }}
        {{- if .Values.components.maintenanceController.enabled }}
        - name: wait-for-maintenance
          image: {{ .Values.images.loadgen | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - "sh"
            - "-c"
            - "until curl -sf http://db-maintenance:8081/healthz; do echo waiting for db-maintenance; sleep 2; done"
        {{- end }}
        {{- if not $.Values.sregym.enabled }}
        - name: verifier-restart-survivor-baseline
          image: {{ .Values.images.loadgen | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - sh
            - -ceu
            - |
              output=/grader/sut/restart-baseline.json
              state=/grader/sut/.restart-baseline
              mkdir -p /grader/sut
              if [ -f "$state.ready" ]; then
                [ -s "$output" ] || { echo "protected restart baseline is empty" >&2; exit 1; }
                python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$output"
                echo "reusing protected restart baseline"
                exit 0
              fi
              if [ -e "$state.starting" ] || [ -e "$output" ]; then
                echo "protected restart baseline capture was interrupted; refusing to recapture" >&2
                exit 1
              fi
              : > "$state.starting"
              python3 -m verifier.restart_survivor --output "$output" --profile lock_guard
              [ -s "$output" ] || { echo "protected restart baseline capture was empty" >&2; exit 1; }
              python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$output"
              mv "$state.starting" "$state.ready"
          env:
            - name: PYTHONPATH
              value: /opt/verifier
            - name: DB_ADMIN_DSN
              value: "postgresql://{{ .Values.postgres.adminRole }}:{{ .Values.postgres.adminPassword }}@db:5432/{{ .Values.postgres.database }}"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: grader
              mountPath: /grader
            - name: verifier-restart-survivor-code
              mountPath: /opt/verifier/verifier
              readOnly: true
        {{- end }}
      containers:
        - name: loadgen
          image: {{ .Values.images.loadgen | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          {{- if .Values.gradingHarness.verifierEvidence.persistent }}
          # v13 predates durable episode resume. This compatibility entrypoint
          # uses only the sidecar module already installed in that pinned image,
          # so the evidence fix is deployable without publishing a new image.
          # A future image with the native helper takes its own code path.
          command: ["python3", "/opt/verifier-evidence/entrypoint.py"]
          {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # Load profile compiled into the loadgen image (loadgen/schedule.py
            # PROFILES). The sidecar reads PROFILE (default "dev" if unset); we set
            # it EXPLICITLY here so a scenario overlay can select a longer window
            # (e.g. "eval25" for a real ~25-min agent run) without touching the
            # image. The sidecar fails loudly if the name is not a known profile.
            - name: PROFILE
              value: {{ .Values.loadgen.profile | quote }}
            {{- if eq .Values.loadgen.profile "auth_key_split_history" }}
            - name: TEMPORAL_HISTORY_GATE
              value: "1"
            {{- end }}
            {{- if .Values.loadgen.profilesYaml }}
            # YAML-defined load profiles (loadgen/profile_loader.py): the inline
            # .Values.loadgen.profilesYaml document is rendered into the
            # loadgen-profiles ConfigMap, mounted read-only, and merged OVER the
            # compiled PROFILES at sidecar startup — deploy a custom load pattern
            # to any environment without an image rebuild. PROFILE may then name
            # a profile defined in that file. DEFAULT-OFF: empty renders no env
            # line / ConfigMap / mount, byte-identical to the prior pod spec.
            - name: PROFILE_FILE
              value: /etc/loadgen/profiles.yaml
            {{- end }}
            - name: TARGET
              value: {{ .Values.loadgen.target | quote }}
            - name: LOADGEN_AUTH_BASE_URL
              value: {{ .Values.loadgen.authTarget | quote }}
            {{- if $authEnabled }}
            - name: LOADGEN_CONTROLLER_PRIVATE_KEY_FILE
              value: /run/auth-controller/controller-private.pem
            {{- end }}
            - name: LOADGEN_FILE_BASE_URL
              value: {{ .Values.loadgen.fileTarget | quote }}
            - name: LOADGEN_CHANNEL_RT_BASE_URL
              value: {{ .Values.loadgen.channelRtTarget | quote }}
            - name: LOADGEN_WS_GATEWAY_BASE_URL
              value: {{ .Values.loadgen.wsGatewayTarget | quote }}
            # Presence is a separate Python service on a non-8000 port; the session_presence
            # driver reads LOADGEN_PRESENCE_BASE_URL directly (cannot host-swap from TARGET).
            - name: LOADGEN_PRESENCE_BASE_URL
              value: {{ .Values.loadgen.presenceTarget | quote }}
            - name: GRADER_DIR
              value: {{ .Values.loadgen.graderDir | quote }}
            - name: GRADER_ACCESS_TOKEN_FILE
              value: /run/grader-access/token
            - name: OBS_DIR
              value: {{ .Values.loadgen.obsDir | quote }}
            # Every app role whose live /admin/config the sidecar snapshots at the
            # declare instant — the verifier's minimality basis (config_after) is
            # rebuilt from this snapshot across ALL services, not a post-soak read of
            # svc-message alone. Drives off the chart's role set so it stays in sync.
            - name: SNAPSHOT_SERVICES
              value: {{ .Values.loadgen.snapshotServices | default (keys .Values.app.roles | sortAlpha | join ",") | quote }}
            {{- if .Values.loadgen.snapshotInfra }}
            - name: SNAPSHOT_INFRA
              value: {{ .Values.loadgen.snapshotInfra | quote }}
            {{- end }}
            {{- if .Values.loadgen.scrapeServices }}
            # P3a multi-service async-tier scrape targets (comma-joined host:port
            # entries, e.g. "worker-index:8122"). DEFAULT-OFF: unset/empty renders NO
            # env line, so the sidecar runs the unchanged single-svc-message scrape
            # and writes NO async_metrics.jsonl (the 6 prior scenarios are byte-
            # identical). A P3b worker-lane overlay sets .Values.loadgen.scrapeServices.
            - name: SCRAPE_SERVICES
              value: {{ .Values.loadgen.scrapeServices | quote }}
            {{- end }}
            {{- if .Values.loadgen.workerSnapshotServices }}
            - name: WORKER_SNAPSHOT_SERVICES
              value: {{ .Values.loadgen.workerSnapshotServices | quote }}
            {{- end }}
            {{- if or .Values.gradingHarness.dbState.enabled .Values.gradingHarness.lockState.enabled .Values.gradingHarness.temporalHistory.enabled }}
            # Superuser DSN for private db_state, lock_state, or temporal-history
            # probes — rendered from postgres.*
            # exactly like main's DB_ADMIN_DSN (no secret duplication). DEFAULT-OFF:
            # no env line unless a scenario explicitly declares one of those probes.
            - name: DB_ADMIN_DSN
              value: "postgresql://{{ .Values.postgres.adminRole }}:{{ .Values.postgres.adminPassword }}@db:5432/{{ .Values.postgres.database }}"
            {{- end }}
            {{- if .Values.agentSurface.buildCapable.enabled }}
            - name: SOURCE_SNAPSHOT_ENABLED
              value: "1"
            - name: SOURCE_ROOT
              value: /src/services/app/src
            - name: BUILD_TARGET_POD
              value: "svc-{{ .Values.agentSurface.buildCapable.targetRole }}-0"
            - name: SOURCE_MAX_FILES
              value: {{ .Values.agentSurface.buildCapable.snapshotMaxFiles | int64 | quote }}
            - name: SOURCE_MAX_FILE_BYTES
              value: {{ .Values.agentSurface.buildCapable.snapshotMaxFileBytes | int64 | quote }}
            - name: SOURCE_MAX_BYTES
              value: {{ .Values.agentSurface.buildCapable.snapshotMaxBytes | int64 | quote }}
            {{- end }}
          ports:
            - name: declare
              containerPort: 9100
          volumeMounts:
            - name: grader
              mountPath: {{ .Values.loadgen.graderDir }}
            - name: grader-access
              mountPath: /run/grader-access
              readOnly: true
            {{- if .Values.gradingHarness.verifierEvidence.persistent }}
            - name: verifier-evidence-entrypoint
              mountPath: /opt/verifier-evidence
              readOnly: true
            {{- end }}
            {{- if $authEnabled }}
            - name: auth-controller-private
              mountPath: /run/auth-controller
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- if .Values.gradingHarness.answerKey.enabled }}
            - name: grader-key
              mountPath: /grader-key
              readOnly: true
            {{- end }}
            {{- if .Values.loadgen.profilesYaml }}
            - name: profiles
              mountPath: /etc/loadgen
              readOnly: true
            {{- end }}
            {{- if .Values.agentSurface.buildCapable.enabled }}
            - name: source
              mountPath: /src
              readOnly: true
            {{- end }}
          resources:
            {{- include "slack.resources" (dict "root" $ "key" "loadgen") | nindent 12 }}
      volumes:
        {{- if not $.Values.sregym.enabled }}
        - name: verifier-restart-survivor-code
          configMap:
            name: verifier-restart-survivor-code
            defaultMode: 0444
        {{- end }}
        - name: grader
          {{- if .Values.gradingHarness.verifierEvidence.persistent }}
          persistentVolumeClaim:
            claimName: loadgen-grader-evidence
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: grader-access
          secret:
            secretName: loadgen-grader-access
            defaultMode: 0444
        {{- if .Values.gradingHarness.verifierEvidence.persistent }}
        - name: verifier-evidence-entrypoint
          configMap:
            name: verifier-evidence-entrypoint
            defaultMode: 0444
        {{- end }}
        {{- if $authEnabled }}
        - name: auth-controller-private
          secret:
            secretName: auth-controller-private
            defaultMode: 0440
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.gradingHarness.answerKey.enabled }}
        - name: grader-key
          configMap:
            name: loadgen-grader-key
        {{- end }}
        {{- if .Values.loadgen.profilesYaml }}
        - name: profiles
          configMap:
            name: loadgen-profiles
        {{- end }}
        {{- if .Values.agentSurface.buildCapable.enabled }}
        - name: source
          persistentVolumeClaim:
            claimName: src-svc-{{ .Values.agentSurface.buildCapable.targetRole }}
        {{- end }}
---
# Declare endpoint Service: main's submit_incident_report POSTs the agent's
# incident report to http://loadgen:9100/declare (the agent never reaches /grader).
apiVersion: v1
kind: Service
metadata:
  name: loadgen
  labels:
    {{- include "slack.labels" $ | nindent 4 }}
    app.kubernetes.io/component: loadgen
{{- with $.Values.sregym.loadgenLabels }}{{ toYaml . | nindent 4 }}{{- end }}
spec:
  selector:
    app.kubernetes.io/component: loadgen
  ports:
    - name: declare
      port: 9100
      targetPort: declare
{{- end }}
