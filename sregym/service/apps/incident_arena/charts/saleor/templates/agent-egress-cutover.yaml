{{- if .Values.main.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: agent-egress-cutover-auth
  labels:
    {{- include "saleor-spine.labels" $ | nindent 4 }}
type: Opaque
stringData:
  token: {{ randAlphaNum 64 | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-egress-controller
  labels:
    {{- include "saleor-spine.labels" $ | nindent 4 }}
    app.kubernetes.io/component: agent-egress-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-egress-cutover
  labels:
    {{- include "saleor-spine.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["agent-egress-proxy"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-egress-cutover
  labels:
    {{- include "saleor-spine.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: agent-egress-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-egress-cutover
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-egress-cutover
  labels:
    {{- include "saleor-spine.labels" $ | nindent 4 }}
data:
  set-agent-egress-phase: |-
{{ .Files.Get "files/set-agent-egress-phase.py" | indent 4 }}
  agent-egress-controller.py: |-
{{ .Files.Get "files/agent-egress-controller.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-egress-controller
  labels:
    {{- include "saleor-spine.labels" $ | nindent 4 }}
    app.kubernetes.io/component: agent-egress-controller
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: agent-egress-controller}
  template:
    metadata:
      labels:
        {{- include "saleor-spine.labels" $ | nindent 8 }}
        app.kubernetes.io/component: agent-egress-controller
      annotations:
        checksum/code: {{ printf "%s:%s" (.Files.Get "files/set-agent-egress-phase.py") (.Files.Get "files/agent-egress-controller.py") | sha256sum }}
    spec:
      serviceAccountName: agent-egress-controller
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: {{ .Values.images.main | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["python3", "/opt/agent-egress/agent-egress-controller.py"]
          ports:
            - {name: http, containerPort: 9191}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 1
            periodSeconds: 3
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: "10m", memory: "32Mi"}
            limits: {cpu: "100m", memory: "96Mi"}
          volumeMounts:
            - {name: code, mountPath: /opt/agent-egress, readOnly: true}
            - {name: auth, mountPath: /run/agent-egress-controller/auth, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: code
          configMap:
            name: agent-egress-cutover
            defaultMode: 0444
        - name: auth
          secret:
            secretName: agent-egress-cutover-auth
            defaultMode: 0400
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-egress-controller
  labels:
    {{- include "saleor-spine.labels" $ | nindent 4 }}
    app.kubernetes.io/component: agent-egress-controller
spec:
  selector: {app.kubernetes.io/component: agent-egress-controller}
  ports:
    - {name: http, port: 9191, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-egress-controller
  labels:
    {{- include "saleor-spine.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: agent-egress-controller}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/component: main}
      ports:
        - {protocol: TCP, port: 9191}
{{- end }}
