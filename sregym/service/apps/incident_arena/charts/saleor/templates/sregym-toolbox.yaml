{{- if and .Values.sregym.enabled .Values.sregym.toolbox.enabled }}
# ── SREGym port: operator toolbox ────────────────────────────────────────────
# Replaces the Harbor `main` foothold (egress proxy, DNS filter and agent
# freezer are not deployed under SREGym). It keeps the operator repair surface
# the Incident Arena task was designed around: psql with the privileged DSN,
# curl for the GraphQL API, and the RabbitMQ management credentials. The
# episode-control commands are replaced with stubs because SREGym collects
# diagnoses through its own submission API and never ends the load generator's
# schedule.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ops-toolbox-stubs
  labels:
    {{- include "saleor-spine.labels" $ | nindent 4 }}
    app.kubernetes.io/component: ops-toolbox
data:
  disabled-command: |
    #!/bin/sh
    echo "$(basename "$0") is not used in this environment; report findings through the SREGym submission API." >&2
    exit 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-toolbox
  labels:
    {{- include "saleor-spine.labels" $ | nindent 4 }}
    app.kubernetes.io/component: ops-toolbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: ops-toolbox
  template:
    metadata:
      labels:
        {{- include "saleor-spine.labels" $ | nindent 8 }}
        app.kubernetes.io/component: ops-toolbox
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: toolbox
          image: {{ .Values.images.main | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["sleep", "infinity"]
          env:
            - name: DB_ADMIN_DSN
              value: "postgres://{{ .Values.postgres.auth.username }}:{{ .Values.postgres.auth.password }}@postgres:5432/{{ .Values.postgres.auth.database }}"
            - name: SALEOR_API_URL
              value: "http://svc-saleor-api:8000/graphql/"
            - name: RABBITMQ_ADMIN_URL
              value: "http://{{ .Values.rabbitmq.auth.username }}:{{ .Values.rabbitmq.auth.password }}@rabbitmq:15672"
          volumeMounts:
            - name: stubs
              mountPath: /usr/local/bin/submit_incident_report
              subPath: disabled-command
            - name: stubs
              mountPath: /usr/local/bin/declare_repair_complete
              subPath: disabled-command
          resources:
            requests: {cpu: "20m", memory: "32Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
      volumes:
        - name: stubs
          configMap:
            name: ops-toolbox-stubs
            defaultMode: 0555
{{- end }}
