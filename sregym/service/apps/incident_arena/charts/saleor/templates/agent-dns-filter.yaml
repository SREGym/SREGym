{{- if .Values.main.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-dns-filter-config
  labels:
    {{- include "saleor-spine.labels" $ | nindent 4 }}
    app.kubernetes.io/component: agent-dns-filter
data:
  Corefile: |-
    cluster.local:{{ .Values.agentDnsFilter.port }} {
      errors
      health :8080
      ready :8181
      cache 5
      forward . /etc/resolv.conf {
        policy sequential
        max_fails 1
      }
    }
    .:{{ .Values.agentDnsFilter.port }} {
      errors
      template IN ANY . {
        rcode REFUSED
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-dns-filter
  labels:
    {{- include "saleor-spine.labels" $ | nindent 4 }}
    app.kubernetes.io/component: agent-dns-filter
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-dns-filter
  labels:
    {{- include "saleor-spine.labels" $ | nindent 4 }}
    app.kubernetes.io/component: agent-dns-filter
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: agent-dns-filter}
  template:
    metadata:
      labels:
        {{- include "saleor-spine.labels" $ | nindent 8 }}
        app.kubernetes.io/component: agent-dns-filter
      annotations:
        checksum/config: {{ printf "stock-coredns-v1:cluster.local:%v" .Values.agentDnsFilter.port | sha256sum }}
    spec:
      serviceAccountName: agent-dns-filter
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: dns-filter
          image: {{ .Values.images.coredns | quote }}
          # Like the egress proxy, this chart-only guard is fetched by immutable
          # digest instead of entering the custom image release/side-load set.
          imagePullPolicy: IfNotPresent
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - {name: dns-udp, containerPort: {{ .Values.agentDnsFilter.port }}, protocol: UDP}
            - {name: dns-tcp, containerPort: {{ .Values.agentDnsFilter.port }}, protocol: TCP}
            - {name: ready, containerPort: 8181, protocol: TCP}
          readinessProbe:
            httpGet: {path: /ready, port: ready}
            initialDelaySeconds: 1
            periodSeconds: 3
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            # The stock binary carries a NET_BIND_SERVICE file capability.
            # Retain only that capability so runc can execute it under
            # no-new-privileges; the server itself still listens on high ports.
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          resources:
            requests: {cpu: "10m", memory: "24Mi"}
            limits: {cpu: "100m", memory: "64Mi"}
          volumeMounts:
            - {name: config, mountPath: /etc/coredns, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: agent-dns-filter-config}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-dns-filter
  labels:
    {{- include "saleor-spine.labels" $ | nindent 4 }}
    app.kubernetes.io/component: agent-dns-filter
spec:
  clusterIP: {{ .Values.agentDnsFilter.clusterIP | quote }}
  selector: {app.kubernetes.io/component: agent-dns-filter}
  ports:
    - {name: dns-udp, port: 53, targetPort: dns-udp, protocol: UDP}
    - {name: dns-tcp, port: 53, targetPort: dns-tcp, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-dns-filter
  labels:
    {{- include "saleor-spine.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/component: agent-dns-filter}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [main, db]
      ports:
        - {protocol: UDP, port: {{ .Values.agentDnsFilter.port }}}
        - {protocol: TCP, port: {{ .Values.agentDnsFilter.port }}}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
{{- end }}
