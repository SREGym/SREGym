# Always applied to astronomy-shop, by AstronomyShop.deploy().
#
# Corrections to the vendored opentelemetry-demo chart for the way SREGym
# actually deploys it: correct telemetry routing and apply upstream memory
# fixes while preserving instrumentation, including the flag UI's descriptor cap.

opentelemetry-collector:
  config:
    service:
      pipelines:
        # The chart's metrics pipeline pushes to `http://prometheus:9090/api/v1/otlp`,
        # but AstronomyShop.deploy() sets `prometheus.enabled=false` (the bundled
        # Prometheus ClusterRole collides with the central one in `observe`), so
        # that endpoint does not exist. The exporter therefore fails every batch,
        # grows a retry queue and fills the collector log. SREGym reads metrics
        # from the central Prometheus, which *scrapes* targets rather than
        # receiving pushes, so nothing downstream loses data by dropping this.
        #
        # `spanmetrics` stays in the receivers list (set by the chart) so span
        # metrics are still produced for anything that scrapes the collector.
        metrics:
          exporters: [debug]

# Backport opentelemetry-demo#3105 to the pinned 2.2.0 images. An explicit
# maximum leaves room within the existing 300Mi limits for native memory and
# instrumentation. Preserve the image's javaagent when overriding this variable.
components:
  load-generator:
    # Helm replaces lists. Preserve the sidecar and use the multiarch build
    # of the same upstream v0.5.0 source.
    sidecarContainers:
      - name: locust-exporter
        useDefault:
          env: false
        imageOverride:
          repository: ghcr.io/sregym/locust-exporter
          tag: sha-d2c036bc3d1138f5a0bdaffd3d87f37522c3461a@sha256:03fc297fe4ecb360740da4c04810e530db72576fde4042a7addaa6ba666731da
        service:
          port: 9646
        env:
          - name: LOCUST_EXPORTER_URI
            value: "http://localhost:8089"
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "50m"
  accounting:
    # The first successful upstream nightly after opentelemetry-demo#2876.
    # Source ebb18186819c510b39d64184d774a527a79e1525 changes only Consumer.cs
    # under src/accounting versus 2.2.0: dispose the DB context per message.
    # Pin the multi-platform index, retaining both ARM64 and AMD64 support.
    imageOverride:
      repository: ghcr.io/open-telemetry/demo
      tag: nightly-20939609681-accounting@sha256:51e6720438c13d0a4fefd129b01e2422b176fdb18a9ea71ef08fd84e717e82f4
  ad:
    envOverrides:
      - name: JAVA_TOOL_OPTIONS
        value: "-javaagent:/usr/src/app/opentelemetry-javaagent.jar -Xmx200m"
  fraud-detection:
    envOverrides:
      - name: JAVA_TOOL_OPTIONS
        value: "-javaagent:/usr/src/app/opentelemetry-javaagent.jar -Xmx180m"
  kafka:
    resources:
      # KafkaFaultInjector._run (inject_kafka.py) execs the Kafka admin CLI
      # inside this container, and kubectl exec runs it in the container's own
      # cgroup. The chart declares limits only, so Kubernetes copies the limit
      # into the request: the broker is capped at 600Mi while -Xms400M commits
      # a 400M heap up front. A second JVM needs ~100-150Mi RSS even at
      # -Xmx64m -- which bounds the heap, not metaspace or thread stacks -- so
      # without this override the kernel OOM-kills it and takes the broker
      # down, and kafka_poison_pill_hol_block cannot inject its fault.
      #
      # Pinning the request where it already effectively sits leaves scheduling
      # unchanged; only the burst ceiling moves.
      requests:
        memory: 600Mi
      limits:
        memory: 1Gi
  flagd:
    # KIND/containerd can give pods a NOFILE limit of 1,073,741,816. Erlang
    # allocates memory against that limit at startup and is OOMKilled even
    # with 2 GiB. Cap only this UI process, retaining its upstream 250 MiB
    # memory budget. Do not raise a lower existing descriptor limit.
    # Helm replaces lists, so retain the complete upstream sidecar definition.
    sidecarContainers:
      - name: flagd-ui
        command:
          - /bin/sh
          - -ec
          - |
            current=$(ulimit -n)
            if [ "$current" = unlimited ] || [ "$current" -gt 65536 ]; then
              ulimit -n 65536
            fi
            exec /app/bin/server
        useDefault:
          env: true
        service:
          port: 4000
        env:
          - name: FLAGD_METRICS_EXPORTER
            value: otel
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://$(OTEL_COLLECTOR_NAME):4318
          - name: FLAGD_UI_PORT
            value: "4000"
          - name: SECRET_KEY_BASE
            value: yYrECL4qbNwleYInGJYvVnSkwJuSQJ4ijPTx5tirGUXrbznFIBFVJdPl5t6O9ASw
          - name: PHX_HOST
            value: localhost
        resources:
          limits:
            memory: 250Mi
        volumeMounts:
          - name: config-rw
            mountPath: /app/data
