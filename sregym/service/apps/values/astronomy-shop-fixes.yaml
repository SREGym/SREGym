# Always applied to astronomy-shop, by AstronomyShop.deploy().
#
# Corrections to the vendored opentelemetry-demo chart for the way SREGym
# actually deploys it. Keep telemetry and plugins available without runtime
# public downloads or exports to services that are not deployed.

grafana:
  image:
    registry: ghcr.io
    repository: sregym/grafana
    tag: 12.3.1-opensearch2.34.3
  # The custom image includes this plugin. The chart's plugins list otherwise
  # starts a network download every time a Grafana pod starts.
  plugins: []
  grafana.ini:
    paths:
      plugins: /opt/grafana/plugins
  env:
    GF_PLUGINS_PREINSTALL_DISABLED: "true"

opentelemetry-collector:
  config:
    service:
      pipelines:
        # The chart's metrics pipeline pushes to `http://prometheus:9090/api/v1/otlp`,
        # but AstronomyShop.deploy() sets `prometheus.enabled=false` (the bundled
        # Prometheus ClusterRole collides with the central one in `observe`), so
        # that endpoint does not exist. The exporter therefore fails every batch,
        # grows a retry queue and fills the collector log. SREGym reads metrics
        # from the central Prometheus, which *scrapes* targets rather than
        # receiving pushes, so nothing downstream loses data by dropping this.
        #
        # `spanmetrics` stays in the receivers list (set by the chart) so span
        # metrics are still produced for anything that scrapes the collector.
        metrics:
          exporters: [debug]

# Backport opentelemetry-demo#3105 to the pinned 2.2.0 images.
# Neither ad nor fraud-detection defines a CPU limit, so on multi-core hosts
# (e.g. 64 vCPUs) HotSpot sizes GC/JIT thread pools for all host cores and
# combines with opentelemetry-javaagent metaspace/codecache (~150-180Mi) to
# exceed the 300Mi cgroup ceiling (`OOMKilled`, exit 137). Cap
# ActiveProcessorCount=2 and raise limits.memory to 512Mi while keeping
# requests.memory at 300Mi so scheduling requests are unchanged.
components:
  load-generator:
    # Helm replaces lists. Preserve the sidecar and use the multiarch build
    # of the same upstream v0.5.0 source.
    sidecarContainers:
      - name: locust-exporter
        useDefault:
          env: false
        imageOverride:
          repository: ghcr.io/sregym/locust-exporter
          tag: sha-d2c036bc3d1138f5a0bdaffd3d87f37522c3461a@sha256:03fc297fe4ecb360740da4c04810e530db72576fde4042a7addaa6ba666731da
        service:
          port: 9646
        env:
          - name: LOCUST_EXPORTER_URI
            value: "http://localhost:8089"
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            # The main locust container has no CPU limit, so this sidecar is the
            # only container in the pod that CFS can throttle. At the upstream
            # 50m it spent >25% of periods throttled while polling the locust
            # stats endpoint, which kept `ContainerCPUThrottling` firing on
            # `load-generator` for the whole run. The alert is pod-scoped, so
            # the chronic warning masked real regressions from weak oracles.
            cpu: "500m"
  accounting:
    # The first successful upstream nightly after opentelemetry-demo#2876.
    # Source ebb18186819c510b39d64184d774a527a79e1525 changes only Consumer.cs
    # under src/accounting versus 2.2.0: dispose the DB context per message.
    # Pin the multi-platform index, retaining both ARM64 and AMD64 support.
    imageOverride:
      repository: ghcr.io/open-telemetry/demo
      tag: nightly-20939609681-accounting@sha256:51e6720438c13d0a4fefd129b01e2422b176fdb18a9ea71ef08fd84e717e82f4
  ad:
    envOverrides:
      - name: JAVA_TOOL_OPTIONS
        value: "-javaagent:/usr/src/app/opentelemetry-javaagent.jar -Xmx200m -XX:ActiveProcessorCount=2"
    resources:
      requests:
        memory: 300Mi
      limits:
        memory: 512Mi
  fraud-detection:
    envOverrides:
      - name: JAVA_TOOL_OPTIONS
        value: "-javaagent:/usr/src/app/opentelemetry-javaagent.jar -Xmx180m -XX:ActiveProcessorCount=2"
    resources:
      requests:
        memory: 300Mi
      limits:
        memory: 512Mi
  kafka:
    resources:
      # KafkaFaultInjector._run (inject_kafka.py) execs the Kafka admin CLI
      # inside this container, and kubectl exec runs it in the container's own
      # cgroup. The chart declares limits only, so Kubernetes copies the limit
      # into the request: the broker is capped at 600Mi while -Xms400M commits
      # a 400M heap up front. A second JVM needs ~100-150Mi RSS even at
      # -Xmx64m -- which bounds the heap, not metaspace or thread stacks -- so
      # without this override the kernel OOM-kills it and takes the broker
      # down, and kafka_poison_pill_hol_block cannot inject its fault.
      #
      # Pinning the request where it already effectively sits leaves scheduling
      # unchanged; only the burst ceiling moves.
      requests:
        memory: 600Mi
      limits:
        memory: 1Gi
  valkey-cart:
    resources:
      # The chart caps the server at 20Mi. valkey_auth_disruption injects its
      # fault with `kubectl exec ... valkey-cli CONFIG SET requirepass`, which
      # runs the CLI inside that same cgroup. In SREGym-Lite runs the server was
      # OOMKilled about one second after injection (restart count 1, only in
      # this problem), and the restart erased the runtime-only password, so the
      # mitigation oracle passed before the agent changed anything. The
      # mitigation oracle and the agent exec the same CLI, so they need the same
      # headroom. valkey idles at ~8-10Mi RSS; 64Mi leaves room for the CLI and
      # the OTel redis scraper connections.
      limits:
        memory: 64Mi
  product-catalog:
    resources:
      # The chart caps this Go service at 20Mi with GOMEMLIMIT 16MiB. Under
      # SREGym's locust load it idles at 11-15Mi working set, and in one
      # SREGym-Lite run it was OOMKilled (exit 137) after 25 minutes. A kill
      # fails every /api/products/* request and fires HighRequestErrorRate
      # with no injected fault behind it. GOMEMLIMIT stays at 16MiB (Helm
      # replaces env lists), so the GC behaviour is unchanged; only the kill
      # threshold moves.
      limits:
        memory: 64Mi
  flagd:
    # KIND/containerd can give pods a NOFILE limit of 1,073,741,816. Erlang
    # allocates memory against that limit at startup and is OOMKilled even
    # with 2 GiB. Cap only this UI process, retaining its upstream 250 MiB
    # memory budget. Do not raise a lower existing descriptor limit.
    # Helm replaces lists, so retain the complete upstream sidecar definition.
    sidecarContainers:
      - name: flagd-ui
        command:
          - /bin/sh
          - -ec
          - |
            current=$(ulimit -n)
            if [ "$current" = unlimited ] || [ "$current" -gt 65536 ]; then
              ulimit -n 65536
            fi
            exec /app/bin/server
        useDefault:
          env: true
        service:
          port: 4000
        env:
          - name: FLAGD_METRICS_EXPORTER
            value: otel
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://$(OTEL_COLLECTOR_NAME):4318
          - name: FLAGD_UI_PORT
            value: "4000"
          - name: SECRET_KEY_BASE
            value: yYrECL4qbNwleYInGJYvVnSkwJuSQJ4ijPTx5tirGUXrbznFIBFVJdPl5t6O9ASw
          - name: PHX_HOST
            value: localhost
        resources:
          limits:
            memory: 250Mi
        volumeMounts:
          - name: config-rw
            mountPath: /app/data
