# Docker settings every SREGym Harbor task ships as environment/docker-compose.yaml,
# so `harbor run -d sregym/sregym -a <agent> -e docker` needs no extra flags.
# The task runs a four-node Kubernetes cluster in its own namespaces and cgroups,
# which Docker's defaults forbid. Not --privileged: no devices, and only two
# capabilities are added:
#   SYS_ADMIN  create each node's user namespace and its other namespaces, and
#              mount its cgroups. Holding it exempts the namespaces from Ubuntu
#              24.04's AppArmor restriction on unprivileged user namespaces.
#   NET_ADMIN  build the network between the nodes
# Each node's user namespace has its own owner uid, so its inotify instances
# count against the host's per-user limit separately (see fabric.sh).
# Docker's seccomp filter and masked /proc paths block unshare and the nodes'
# procfs mounts. The open-file limit is a resource limit: TiKV (FleetCast's TiDB)
# needs about 82920 open files. This file is the source the adapter copies into
# each task; tests/harbor checks they match.
services:
  main:
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
    security_opt:
      - seccomp=unconfined
      - systempaths=unconfined
      - apparmor=unconfined
    cgroup: private
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
