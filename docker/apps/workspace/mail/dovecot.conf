# Mailbox service: IMAP for clients, LMTP for delivery from the transport.
protocols = imap lmtp
listen = *
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
log_path = /dev/stderr
info_log_path = /dev/stdout
login_trusted_networks = 0.0.0.0/0

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}
# passwd-file (not static) so doveadm can iterate every user with -A.
userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
}
mail_location = maildir:~/Maildir
first_valid_uid = 5000

# Idle IMAP sessions move to a shared hibernation process, so thousands of
# connected clients do not each hold an imap process.
imap_hibernate_timeout = 5s
service imap {
  vsz_limit = 256M
  process_limit = 4096
  unix_listener imap-master {
    user = $default_internal_user
  }
}
service imap-login {
  service_count = 0
  process_min_avail = 2
  client_limit = 2000
  vsz_limit = 256M
}
service imap-hibernate {
  client_limit = 10000
  unix_listener imap-hibernate {
    mode = 0660
    group = $default_internal_group
  }
}
service lmtp {
  inet_listener lmtp {
    port = 24
  }
}
service auth {
  client_limit = 8192
}
default_client_limit = 10000
default_process_limit = 4096
